<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SYNAPSE 2026 | Registration</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <style>
        :root {
            --poster-pink: #d11fb7;
            --poster-blue: #1fc1d1;
            --poster-purple: #741fd1;
            --background-dark: #07060f;
        }

        body { 
            background-color: var(--background-dark);
            color: #fff;
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        #particles-js {
            position: fixed;
            width: 100%; height: 100%;
            top: 0; left: 0; z-index: 1;
            pointer-events: none !important;
        }

        .main-content { position: relative; z-index: 5; padding: 20px; }

        .poster-container {
            max-width: 800px;
            margin: 10px auto 30px auto;
            border-radius: 12px;
            box-shadow: 0 0 30px rgba(116, 31, 209, 0.4);
            border: 2px solid var(--poster-purple);
        }

        .poster-image { width: 100%; height: auto; display: block; border-radius: 10px; }

        .card { 
            background: rgba(15, 12, 41, 0.96);
            border: 1.5px solid #444;
            border-radius: 20px; 
            box-shadow: 0 20px 60px rgba(0,0,0,0.9);
        }

        .form-label { 
            font-weight: 800 !important; 
            color: #ffffff !important; 
            text-transform: uppercase;
        }

        .form-control, .form-select {
            background-color: #ffffff !important;
            border: 2px solid #666;
            color: #000000 !important;
            font-weight: 600;
        }

        .event-grid { 
            background: rgba(209, 31, 183, 0.1);
            padding: 20px;
            border-radius: 15px;
            border: 2px solid var(--poster-pink);
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--poster-pink), var(--poster-purple));
            border: none;
            padding: 18px;
            font-weight: 900;
            letter-spacing: 2px;
        }

        /* SUCCESS VIEW FIX */
        #successWrapper {
            display: none;
            pointer-events: none; /* Allows touches to pass through the background */
            position: relative;
            z-index: 1000;
        }

        #successMsg {
            border: 3px solid var(--poster-blue);
            background: rgba(7, 6, 15, 0.95);
            border-radius: 20px;
            padding: 40px;
            margin-bottom: 30px;
            pointer-events: auto; /* Box content is clickable */
        }

        /* THE ORIGINAL BUTTON STYLE + ANIMATION */
        .btn-receipt-fixed {
            background: var(--poster-blue) !important;
            color: #000 !important;
            font-weight: 800;
            border: none;
            padding: 18px 30px;
            border-radius: 12px;
            cursor: pointer !important;
            display: block;
            text-align: center;
            text-decoration: none;
            box-shadow: 0 0 20px rgba(31, 193, 209, 0.5);
            pointer-events: auto !important; /* FORCED CLICKABILITY */
            width: 100%;
            margin-top: 20px;
            position: relative;
            z-index: 2000;
        }

        /* MOBILE BOTTOM PINNING */
        @media (max-width: 768px) {
            .btn-receipt-fixed {
                position: fixed;
                bottom: 20px;
                left: 5%;
                width: 90%;
                margin: 0;
                box-shadow: 0 -5px 25px rgba(0,0,0,0.8);
            }
            #successMsg { padding: 25px 15px; margin-bottom: 120px; }
        }

        #qrcode-hidden { display: none; }
    </style>
</head>
<body>

    <div id="particles-js"></div>
    <div id="qrcode-hidden"></div> 

    <div class="main-content container my-4">
        
        <div class="poster-container animate__animated animate__fadeIn" id="posterDiv">
            <img src="synapse-poster.jpg" alt="Synapse 2026 Poster" class="poster-image">
        </div>

        <div class="row justify-content-center">
            <div class="col-lg-8">
                
                <div id="formCard" class="card animate__animated animate__fadeInUp">
                    <div class="card-body p-4 p-md-5">
                        <h2 class="text-center text-uppercase mb-5" style="color: var(--poster-blue); font-weight: 900;">
                            Registration Form
                        </h2>
                        
                        <form id="regForm">
                            <div class="row g-4">
                                <div class="col-md-6"><label class="form-label">Name</label><input type="text" id="name" class="form-control" required></div>
                                <div class="col-md-6"><label class="form-label">Mobile</label><input type="tel" id="mobile" class="form-control" pattern="[0-9]{10}" required></div>
                                <div class="col-md-6"><label class="form-label">Email</label><input type="email" id="email" class="form-control" required></div>
                                <div class="col-md-6"><label class="form-label">College</label><input type="text" id="college" class="form-control" required></div>
                                <div class="col-md-6">
                                    <label class="form-label">Department</label>
                                    <select id="department" class="form-select" required>
                                        <option>Computer Science</option><option>Electronics</option><option>Mechanical</option><option>Civil</option>
                                    </select>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Semester</label>
                                    <select id="semester" class="form-select" required>
                                        <option>S1</option><option>S2</option><option>S3</option><option>S4</option><option>S6</option>
                                    </select>
                                </div>
                            </div>
                            <div class="mt-5">
                                <div class="event-grid row row-cols-2 g-3">
                                    <div class="col"><div class="form-check"><input class="form-check-input event-check" type="checkbox" value="Hackathons" id="e1"><label class="form-check-label text-black" for="e1">Hackathons</label></div></div>
                                    <div class="col"><div class="form-check"><input class="form-check-input event-check" type="checkbox" value="Workshops" id="e2"><label class="form-check-label text-black" for="e2">Workshops</label></div></div>
                                </div>
                                <button type="submit" id="submitBtn" class="btn btn-primary w-100 mt-5">SUBMIT REGISTRATION</button>
                            </div>
                        </form>
                    </div>
                </div>

                <div id="successWrapper">
                    <div id="successMsg" class="animate__animated animate__bounceIn text-center">
                        <h1 style="color: var(--poster-blue); font-weight: 900;">SUCCESS!</h1>
                        <p class="lead text-white">Registration confirmed.</p>
                        <hr style="border-color: #444;">
                        <div id="receiptDetails" class="text-start mb-4 px-3" style="font-size: 1rem; color: #bbb;"></div>
                    </div>

                    <button id="downloadBtn" onclick="downloadPDF()" class="btn-receipt-fixed animate__animated animate__fadeInUp">
                        📥 DOWNLOAD QR RECEIPT (PDF)
                    </button>
                </div>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>
    <script>
        particlesJS("particles-js", { "particles": { "number": { "value": 30 }, "line_linked": { "enable": true, "color": "#1fc1d1" }, "move": { "speed": 1.5 } } });

        const scriptURL = 'https://script.google.com/macros/s/AKfycbwKjrjjrV5hJUrqaP5nWjYAW2HW50y6EI3_k9bfzriS8ktMuAHpYe1i8K6IyPFV-jsndA/exec';
        let registrationData = {};

        document.getElementById('regForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.disabled = true; btn.innerHTML = 'PROCESSING...';

            registrationData = {
                name: document.getElementById('name').value,
                mobile: document.getElementById('mobile').value,
                college: document.getElementById('college').value,
                events: Array.from(document.querySelectorAll('.event-check:checked')).map(c => c.value).join(", ")
            };

            fetch(scriptURL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(registrationData) })
            .then(() => handleSuccess())
            .catch(() => handleSuccess());
        });

        function handleSuccess() {
            document.getElementById('formCard').classList.add('d-none');
            document.getElementById('successWrapper').style.display = 'block';
            document.getElementById('receiptDetails').innerHTML = `<b>Name:</b> ${registrationData.name}<br><b>ID:</b> ${registrationData.mobile}`;
            window.scrollTo({ top: 0, behavior: 'smooth' });
            setTimeout(downloadPDF, 1500); // Auto-download
        }

        function downloadPDF() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            const qrContainer = document.getElementById("qrcode-hidden");
            qrContainer.innerHTML = "";
            new QRCode(qrContainer, { text: registrationData.mobile, width: 256, height: 256 });

            setTimeout(() => {
                const qrImg = qrContainer.querySelector("img").src;
                doc.setFillColor(7, 6, 15); doc.rect(0, 0, 210, 297, 'F');
                doc.setTextColor(31, 193, 209); doc.setFontSize(26);
                doc.text("SYNAPSE 2026", 105, 40, { align: "center" });
                doc.setFillColor(255, 255, 255); doc.rect(60, 55, 90, 90, 'F');
                doc.addImage(qrImg, 'PNG', 65, 60, 80, 80);
                doc.setTextColor(255, 255, 255); doc.setFontSize(14);
                doc.text(`Name: ${registrationData.name}`, 30, 160);
                doc.text(`Mobile: ${registrationData.mobile}`, 30, 175);
                
                const pdfBlob = doc.output('blob');
                const url = URL.createObjectURL(pdfBlob);
                const link = document.createElement('a');
                link.href = url;
                link.download = `Synapse_${registrationData.name}.pdf`;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            }, 600);
        }
    </script>
</body>
</html>
