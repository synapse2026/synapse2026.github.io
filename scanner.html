<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scanner | SYNAPSE 2026</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <style>
        :root {
            --neon-blue: #1fc1d1;
            --neon-pink: #d11fb7;
            --dark-bg: #0a0a0f;
            --warning-gold: #ffc107;
        }

        body { 
            background: var(--dark-bg); 
            color: #fff; 
            font-family: 'Rajdhani', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
        }

        .container { max-width: 450px; padding: 25px; margin: auto; }

        h3 { 
            font-family: 'Orbitron', sans-serif; 
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(31, 193, 209, 0.5);
            font-weight: 700;
        }

        #reader { 
            border: 2px solid var(--neon-blue); 
            border-radius: 15px; 
            overflow: hidden; 
            background: #000;
        }

        .control-panel {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 20px;
            margin-top: 20px;
        }

        .form-control {
            background: rgba(0,0,0,0.5) !important;
            color: #fff !important;
            border: 1px solid #444;
            font-size: 1.2rem;
        }

        .detail-card { 
            background: linear-gradient(145deg, #0f0c29, #1a1a2e); 
            border-radius: 20px; 
            padding: 25px; 
            margin-top: 20px; 
            display: none; 
            border: 1px solid var(--neon-pink);
            box-shadow: 0 0 30px rgba(209, 31, 183, 0.2);
        }

        .label { color: var(--neon-blue); font-size: 0.8rem; font-weight: 700; text-transform: uppercase; margin-top: 12px; }
        .val { font-size: 1.2rem; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 5px; }
        
        .badge-status { 
            padding: 12px; border-radius: 10px; font-weight: 800; 
            display: inline-block; margin-top: 20px; width: 100%; 
            font-family: 'Orbitron', sans-serif; font-size: 0.85rem;
        }

        .bg-red { background: rgba(255, 71, 87, 0.2); color: #ff4757; border: 1px solid #ff4757; }
        .bg-green { background: rgba(46, 213, 115, 0.2); color: #2ed573; border: 1px solid #2ed573; }
        .bg-process { background: rgba(255, 193, 7, 0.1); color: var(--warning-gold); border: 1px solid var(--warning-gold); }
        
        /* QR Container Styling */
        #qr-preview-area {
            background: #fff; 
            padding: 20px; 
            border-radius: 15px;
            display: inline-block; 
            margin: 15px 0;
            box-shadow: 0 0 25px rgba(255,255,255,0.15);
        }

        .qr-instruction {
            color: #aaa;
            font-size: 0.8rem;
            margin-bottom: 10px;
            font-style: italic;
        }
    </style>
</head>
<body>

    <div class="container text-center">
        <h3 class="mb-4" style="color: var(--neon-blue);">GATE CONTROL</h3>
        
        <div id="reader"></div>

        <div id="controls">
            <button onclick="startScanner()" class="btn btn-info w-100 py-3 mt-4 mb-3 fw-bold">📸 OPEN SCANNER</button>
            
            <div class="control-panel">
                <div class="d-flex justify-content-between mb-2">
                    <span class="small text-white-50">MANUAL OVERRIDE</span>
                    <span id="digit-count" class="text-white-50">0/10</span>
                </div>
                <div class="input-group">
                    <input type="tel" id="manual-mobile" class="form-control" placeholder="Phone Number" maxlength="10">
                    <button onclick="handleManualSearch()" class="btn btn-warning px-3 fw-bold">SEARCH</button>
                </div>
            </div>
        </div>

        <div id="result" class="detail-card text-start">
            <h5 class="text-center mb-1" style="color: var(--neon-pink); font-family: 'Orbitron';">VERIFICATION</h5>
            
            <div id="qr-display-section" class="text-center d-none border-bottom border-secondary mb-3">
                <div class="qr-instruction mt-2">Student can scan/photo this QR</div>
                <div id="qr-preview-area"></div>
            </div>

            <div id="infoFields">
                <div class="label">Attendee Name</div><div id="d-name" class="val">-</div>
                <div class="label">Mobile Number</div><div id="d-mobile" class="val">-</div>
                <div class="label">College</div><div id="d-college" class="val">-</div>
                <div class="label">Department</div><div id="d-dept" class="val">-</div>
                <div class="label">Events</div><div id="d-events" class="val">-</div>
            </div>
            
            <div id="statusArea" class="text-center">
                <div id="p-badge" class="badge-status">INITIALIZING...</div>
                <button id="confirmBtn" class="btn btn-primary w-100 mt-3 py-3 fw-bold d-none">MARK ENTRY & PAYMENT</button>
                <div id="alreadyVerifiedMsg" class="mt-3 text-success fw-bold d-none">✓ ENTRY GRANTED</div>
                <button id="editBtn" class="btn btn-outline-info w-100 mt-3 py-2 fw-bold" onclick="openEditModal()">✏️ EDIT PARTICIPANT DETAILS</button>
            </div>
            
            <button class="btn btn-link text-white-50 w-100 mt-3 text-decoration-none" onclick="location.reload()">← BACK TO HOME</button>
        </div>

        <!-- MODAL: EDIT PARTICIPANT DETAILS -->
        <div id="editModal" class="detail-card text-start" style="display:none; border-color: var(--neon-blue); box-shadow: 0 0 30px rgba(31, 193, 209, 0.25);">
            <h5 class="text-center mb-3" style="color: var(--neon-blue); font-family: 'Orbitron';">EDIT PARTICIPANT</h5>
            
            <div class="mb-2">
                <label class="label mt-0">Full Name</label>
                <input type="text" id="edit-name" class="form-control form-control-sm mt-1">
            </div>
            <div class="mb-2">
                <label class="label mt-0">College</label>
                <input type="text" id="edit-college" class="form-control form-control-sm mt-1">
            </div>
            <div class="mb-2">
                <label class="label mt-0">Department</label>
                <input type="text" id="edit-dept" class="form-control form-control-sm mt-1">
            </div>
            
            <div class="mb-3">
                <label class="label mt-0">Registered Events</label>
                <div id="edit-events-container" class="mt-1 p-2 rounded" style="background: rgba(0,0,0,0.4); border: 1px solid #333; max-height: 180px; overflow-y: auto;">
                    <!-- Event checkboxes populated by JS -->
                </div>
            </div>

            <div class="mb-3">
                <label class="label mt-0">Payment Status</label>
                <select id="edit-payment" class="form-select mt-1" style="background: rgba(0,0,0,0.6); color: #fff; border: 1px solid #444;">
                    <option value="COMPLETED">PAID & VERIFIED (COMPLETED)</option>
                    <option value="PENDING">PAYMENT PENDING (PENDING)</option>
                </select>
            </div>

            <div class="row g-2 mt-2">
                <div class="col-6">
                    <button id="saveEditBtn" onclick="saveParticipantDetails()" class="btn btn-success w-100 py-2 fw-bold">💾 SAVE</button>
                </div>
                <div class="col-6">
                    <button onclick="closeEditModal()" class="btn btn-outline-secondary w-100 py-2 fw-bold">CANCEL</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const scriptURL = 'https://script.google.com/macros/s/AKfycbwKjrjjrV5hJUrqaP5nWjYAW2HW50y6EI3_k9bfzriS8ktMuAHpYe1i8K6IyPFV-jsndA/exec';
        const ALL_EVENTS = ["Glow Craft", "Reverse X", "Trail Blaze", "Brain 2 Bot", "Titan Trials", "Pixel Clash", "Innosense", "Seminar Presentation", "Play villa"];
        const html5QrCode = new Html5Qrcode("reader");
        let currentMob = "";
        let currentParticipant = null;

        // UI Digit Counter
        document.getElementById('manual-mobile').addEventListener('input', e => {
            const len = e.target.value.length;
            const counter = document.getElementById('digit-count');
            counter.innerText = `${len}/10`;
            counter.style.color = (len === 10) ? '#2ed573' : '#aaa';
        });

        function startScanner() {
            html5QrCode.start({ facingMode: 'environment' }, { fps: 20, qrbox: 250 }, onScanSuccess)
                .catch(() => alert("Camera error. Please allow permissions."));
        }

        function handleManualSearch() {
            const val = document.getElementById('manual-mobile').value.trim();
            if(val.length < 10) return alert("Please enter 10 digits");
            handleData(val);
        }

        const handleData = (mobile) => {
            currentMob = mobile.trim();
            document.getElementById('controls').style.display = 'none';
            document.getElementById('result').style.display = 'block';
            
            const badge = document.getElementById('p-badge');
            badge.innerText = "SEARCHING DATABASE...";
            badge.className = "badge-status bg-process";

            fetch(`${scriptURL}?action=search&mobile=${currentMob}`)
                .then(res => res.text())
                .then(responseText => {
                    if (responseText === "NotFound") {
                        badge.innerText = "REGISTRATION NOT FOUND";
                        badge.className = "badge-status bg-red";
                        document.getElementById('d-name').innerText = "NOT FOUND";
                        document.getElementById('d-mobile').innerText = currentMob;
                        document.getElementById('d-college').innerText = "-";
                        document.getElementById('d-dept').innerText = "-";
                        document.getElementById('d-events').innerText = "-";
                        document.getElementById('editBtn').style.display = 'none';
                        return;
                    }

                    const data = JSON.parse(responseText);
                    currentParticipant = data;
                    document.getElementById('d-name').innerText = data.name || "-";
                    document.getElementById('d-mobile').innerText = data.mobile || currentMob;
                    document.getElementById('d-college').innerText = data.college || "-";
                    document.getElementById('d-dept').innerText = data.dept || "-";
                    document.getElementById('d-events').innerText = data.events || "-";
                    document.getElementById('editBtn').style.display = 'block';
                    
                    // Show Large QR for Student
                    const qrArea = document.getElementById("qr-preview-area");
                    qrArea.innerHTML = "";
                    new QRCode(qrArea, { text: data.mobile, width: 180, height: 180 });
                    document.getElementById('qr-display-section').classList.remove('d-none');

                    if (data.payment === "COMPLETED") {
                        badge.innerText = "STATUS: PAID & VERIFIED";
                        badge.className = "badge-status bg-green";
                        document.getElementById('alreadyVerifiedMsg').classList.remove('d-none');
                        document.getElementById('confirmBtn').classList.add('d-none');
                    } else {
                        badge.innerText = "STATUS: PAYMENT PENDING";
                        badge.className = "badge-status bg-red";
                        document.getElementById('confirmBtn').classList.remove('d-none');
                        document.getElementById('alreadyVerifiedMsg').classList.add('d-none');
                    }
                })
                .catch(() => {
                    badge.innerText = "NETWORK ERROR";
                    badge.className = "badge-status bg-red";
                });
        };

        const onScanSuccess = (t) => { 
            if(html5QrCode.isScanning) html5QrCode.stop(); 
            handleData(t); 
        };

        document.getElementById('confirmBtn').addEventListener('click', function() {
            this.disabled = true; this.innerText = "PROCESSING...";
            fetch(`${scriptURL}?action=updatePayment&mobile=${currentMob}`)
                .then(r => r.text())
                .then(() => { alert("Entry Confirmed!"); location.reload(); });
        });

        function openEditModal() {
            if (!currentParticipant) return;
            document.getElementById('edit-name').value = currentParticipant.name || "";
            document.getElementById('edit-college').value = currentParticipant.college || "";
            document.getElementById('edit-dept').value = currentParticipant.dept || "";
            document.getElementById('edit-payment').value = (currentParticipant.payment === "COMPLETED") ? "COMPLETED" : "PENDING";

            const container = document.getElementById('edit-events-container');
            container.innerHTML = "";
            const selectedEvents = (currentParticipant.events || "").split(',').map(e => e.trim());
            ALL_EVENTS.forEach(ev => {
                const isChecked = selectedEvents.includes(ev);
                const itemDiv = document.createElement('div');
                itemDiv.className = "form-check my-1";
                itemDiv.innerHTML = `
                    <input class="form-check-input event-edit-check" type="checkbox" id="chk-${ev.replace(/\s+/g, '')}" value="${ev}" ${isChecked ? 'checked' : ''}>
                    <label class="form-check-label text-light small ms-1" for="chk-${ev.replace(/\s+/g, '')}">${ev}</label>
                `;
                container.appendChild(itemDiv);
            });

            document.getElementById('result').style.display = 'none';
            document.getElementById('editModal').style.display = 'block';
        }

        function closeEditModal() {
            document.getElementById('editModal').style.display = 'none';
            document.getElementById('result').style.display = 'block';
        }

        function saveParticipantDetails() {
            const saveBtn = document.getElementById('saveEditBtn');
            saveBtn.disabled = true;
            saveBtn.innerText = "SAVING...";

            const updatedName = document.getElementById('edit-name').value.trim();
            const updatedCollege = document.getElementById('edit-college').value.trim();
            const updatedDept = document.getElementById('edit-dept').value.trim();
            const updatedPayment = document.getElementById('edit-payment').value;
            const checkedBoxes = Array.from(document.querySelectorAll('.event-edit-check:checked'));
            const updatedEvents = checkedBoxes.map(cb => cb.value).join(', ');

            const payload = {
                action: "register",
                name: updatedName,
                mobile: currentMob,
                college: updatedCollege,
                dept: updatedDept,
                events: updatedEvents,
                payment: updatedPayment
            };

            // 1. Submit POST update to backend
            fetch(scriptURL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            // 2. If payment marked COMPLETED, trigger GET updatePayment as well
            if (updatedPayment === "COMPLETED") {
                fetch(`${scriptURL}?action=updatePayment&mobile=${currentMob}`);
            }

            // 3. Immediately reflect changes in the local UI
            currentParticipant.name = updatedName;
            currentParticipant.college = updatedCollege;
            currentParticipant.dept = updatedDept;
            currentParticipant.events = updatedEvents;
            currentParticipant.payment = updatedPayment;

            document.getElementById('d-name').innerText = updatedName;
            document.getElementById('d-college').innerText = updatedCollege;
            document.getElementById('d-dept').innerText = updatedDept;
            document.getElementById('d-events').innerText = updatedEvents;

            const badge = document.getElementById('p-badge');
            const confirmBtn = document.getElementById('confirmBtn');
            const alreadyVerifiedMsg = document.getElementById('alreadyVerifiedMsg');

            if (updatedPayment === "COMPLETED") {
                badge.innerText = "STATUS: PAID & VERIFIED";
                badge.className = "badge-status bg-green";
                confirmBtn.classList.add('d-none');
                alreadyVerifiedMsg.classList.remove('d-none');
            } else {
                badge.innerText = "STATUS: PAYMENT PENDING";
                badge.className = "badge-status bg-red";
                confirmBtn.classList.remove('d-none');
                alreadyVerifiedMsg.classList.add('d-none');
            }

            saveBtn.disabled = false;
            saveBtn.innerText = "💾 SAVE";
            closeEditModal();
            alert("✅ Participant details updated successfully!");
        }
    </script>
</body>
</html>
