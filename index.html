<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SYNAPSE 2026 | Staff Scanner</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>

    <style>
        body { background: #07060f; color: #fff; font-family: sans-serif; }
        .scanner-container { max-width: 500px; margin: auto; padding: 20px; }
        #reader { width: 100%; border-radius: 20px; overflow: hidden; border: 3px solid #1fc1d1 !important; background: #000; }
        .btn-start { background: #1fc1d1; color: #000; font-weight: 900; border: none; padding: 15px; width: 100%; border-radius: 10px; margin-bottom: 15px; }
        .btn-upload { background: #ffc107; color: #000; font-weight: 900; border: none; padding: 15px; width: 100%; border-radius: 10px; margin-bottom: 10px; display: block; cursor: pointer; }
        .btn-checkin { background: #d11fb7; color: #fff; font-weight: 900; border: none; padding: 15px; width: 100%; border-radius: 10px; }
        .result-card { background: rgba(15, 12, 41, 0.98); border-radius: 15px; padding: 25px; margin-top: 20px; display: none; border: 2px solid #1fc1d1; }
        .scan-status { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px; color: #1fc1d1; margin: 10px 0; }
        #qr-input-file { display: none; }
    </style>
</head>
<body>

    <div class="scanner-container text-center">
        <h2 class="my-4" style="color: #1fc1d1; font-weight: 900; letter-spacing: 2px;">SYNAPSE SCANNER</h2>
        
        <div id="reader"></div>
        <div id="status" class="scan-status">System: Ready</div>

        <div class="controls">
            <button id="startBtn" class="btn-start">📸 LIVE SCANNER</button>
            <label for="qr-input-file" class="btn-upload">🖼️ TAKE PHOTO & VERIFY</label>
            <input type="file" id="qr-input-file" accept="image/*" capture="environment">
        </div>

        <div id="result" class="result-card text-start">
            <h4 style="color: #1fc1d1;">✓ VERIFIED</h4>
            <hr style="border-color: #444;">
            <div id="scannedData" class="mb-4" style="line-height: 1.8; font-size: 1.1rem;"></div>
            <button id="checkinBtn" class="btn-checkin mb-3">✅ MARK AS PRESENT</button>
            <button class="btn btn-outline-secondary w-100 text-white" onclick="location.reload()">Reset Scanner</button>
        </div>
    </div>

    <script>
        const scriptURL = 'https://script.google.com/macros/s/AKfycbwKjrjjrV5hJUrqaP5nWjYAW2HW50y6EI3_k9bfzriS8ktMuAHpYe1i8K6IyPFV-jsndA/exec'; // MUST BE YOUR GOOGLE SCRIPT URL
        const html5QrCode = new Html5Qrcode("reader");
        const fileInput = document.getElementById('qr-input-file');
        const statusText = document.getElementById('status');
        let currentMobile = "";

        const onScanSuccess = (decodedText) => {
            navigator.vibrate(200);
            statusText.innerText = "SUCCESS";
            document.getElementById('result').style.display = 'block';
            document.getElementById('scannedData').innerHTML = decodedText.replaceAll('|', '<br>');
            const match = decodedText.match(/Mobile:\s*(\d{10})/);
            currentMobile = match ? match[1] : "";
            if (html5QrCode.isScanning) html5QrCode.stop();
        };

        // Live Mode
        document.getElementById('startBtn').addEventListener('click', () => {
            statusText.innerText = "Camera: Starting...";
            html5QrCode.start({ facingMode: "environment" }, { fps: 20, qrbox: 280 }, onScanSuccess)
            .then(() => statusText.innerText = "Live Scanning Active")
            .catch(() => statusText.innerText = "Camera Error");
        });

        // Robust Photo Mode with Image Scaling
        fileInput.addEventListener('change', e => {
            if (e.target.files.length == 0) return;
            statusText.innerText = "Optimizing Image...";
            
            const file = e.target.files[0];
            const reader = new FileReader();
            
            reader.onload = function(event) {
                const img = new Image();
                img.onload = function() {
                    // Create a canvas to downscale the image
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 800; // Shrink for faster processing
                    let width = img.width;
                    let height = img.height;

                    if (width > MAX_WIDTH) {
                        height *= MAX_WIDTH / width;
                        width = MAX_WIDTH;
                    }

                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    
                    statusText.innerText = "Analyzing QR...";
                    
                    // Scan the optimized canvas instead of the raw file
                    html5QrCode.scanFileV2(canvas, true)
                        .then(res => onScanSuccess(res.decodedText))
                        .catch(() => {
                            statusText.innerText = "QR not found. Try closer.";
                        });
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        });

        // Check-in
        document.getElementById('checkinBtn').addEventListener('click', function() {
            this.disabled = true; this.innerText = "CHECKING IN...";
            fetch(`${scriptURL}?action=checkin&mobile=${currentMobile}`)
            .then(res => res.text())
            .then(res => { alert(res); location.reload(); })
            .catch(() => { alert("Retry"); this.disabled = false; });
        });
    </script>
</body>
</html>
