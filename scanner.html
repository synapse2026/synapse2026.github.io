<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SYNAPSE 2026 | Staff Scanner</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>

    <style>
        body { background: #07060f; color: #fff; font-family: sans-serif; }
        .scanner-container { max-width: 500px; margin: auto; padding: 20px; }
        
        #reader { 
            width: 100%;
            border-radius: 20px; 
            overflow: hidden; 
            border: 3px solid #1fc1d1 !important;
            background: #000;
        }

        .controls { margin-top: 20px; }
        .btn-start { background: #1fc1d1; color: #000; font-weight: 900; border: none; padding: 15px; width: 100%; border-radius: 10px; margin-bottom: 15px; }
        .btn-capture { background: #ffc107; color: #000; font-weight: 900; border: none; padding: 12px; width: 100%; border-radius: 10px; display: none; margin-bottom: 10px; }
        .btn-checkin { background: #d11fb7; color: #fff; font-weight: 900; border: none; padding: 15px; width: 100%; border-radius: 10px; }
        
        .result-card { 
            background: rgba(15, 12, 41, 0.98); 
            border-radius: 15px; 
            padding: 25px; 
            margin-top: 20px; 
            display: none; 
            border: 2px solid #1fc1d1;
        }

        .scan-status { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 1px; color: #1fc1d1; margin: 10px 0; }
    </style>
</head>
<body>

    <div class="scanner-container text-center">
        <h2 class="my-4" style="color: #1fc1d1; font-weight: 900; letter-spacing: 2px;">SYNAPSE SCANNER</h2>
        
        <div id="reader"></div>
        <div id="status" class="scan-status">Camera: Offline</div>

        <div class="controls">
            <button id="startBtn" class="btn-start">📸 START CAMERA</button>
            <button id="captureBtn" class="btn-capture">🔍 CAPTURE & VERIFY MANUALLY</button>
        </div>

        <div id="result" class="result-card text-start">
            <h4 style="color: #1fc1d1;">✓ VERIFIED</h4>
            <hr style="border-color: #444;">
            <div id="scannedData" class="mb-4" style="line-height: 1.8; font-size: 1.1rem;"></div>
            <button id="checkinBtn" class="btn-checkin mb-3">✅ MARK AS PRESENT</button>
            <button class="btn btn-outline-secondary w-100 text-white" onclick="location.reload()">Reset Scanner</button>
        </div>
    </div>

    <script>
        const scriptURL = 'https://script.google.com/macros/s/AKfycbwKjrjjrV5hJUrqaP5nWjYAW2HW50y6EI3_k9bfzriS8ktMuAHpYe1i8K6IyPFV-jsndA/exec'; // MUST BE YOUR GOOGLE SCRIPT URL
        const html5QrCode = new Html5Qrcode("reader");
        const startBtn = document.getElementById('startBtn');
        const captureBtn = document.getElementById('captureBtn');
        const statusText = document.getElementById('status');
        let currentMobile = "";

        const onScanSuccess = (decodedText) => {
            navigator.vibrate(200);
            html5QrCode.stop().then(() => {
                captureBtn.style.display = 'none';
                statusText.innerText = "Camera: Success";
                document.getElementById('result').style.display = 'block';
                document.getElementById('scannedData').innerHTML = decodedText.replaceAll('|', '<br>');
                
                const match = decodedText.match(/Mobile:\s*(\d{10})/);
                currentMobile = match ? match[1] : "";
            });
        };

        // Manual Start
        startBtn.addEventListener('click', () => {
            startBtn.style.display = 'none';
            captureBtn.style.display = 'block';
            statusText.innerText = "Camera: Starting...";
            
            html5QrCode.start(
                { facingMode: "environment" }, 
                { fps: 20, qrbox: { width: 280, height: 280 } }, 
                onScanSuccess
            ).then(() => {
                statusText.innerText = "Camera: Active (Scanning)";
            }).catch(err => {
                alert("Camera Error: " + err);
                startBtn.style.display = 'block';
            });
        });

        // NEW: Force a scan from a still frame if auto-scan is stuck
        captureBtn.addEventListener('click', () => {
            statusText.innerText = "Analyzing Frame...";
            const videoElement = document.querySelector('video');
            
            if (videoElement) {
                // The scanImage function forces the library to look at the current video frame as a static image
                html5QrCode.scanFile(videoElement, false) 
                .then(decodedText => onScanSuccess(decodedText))
                .catch(err => {
                    statusText.innerText = "Still blurry. Try moving closer.";
                });
            }
        });

        document.getElementById('checkinBtn').addEventListener('click', function() {
            this.disabled = true;
            this.innerText = "UPDATING...";
            fetch(`${scriptURL}?action=checkin&mobile=${currentMobile}`)
                .then(res => res.text())
                .then(response => {
                    alert("Attendance Status: " + response);
                    location.reload();
                })
                .catch(() => {
                    alert("Update failed. Check net.");
                    this.disabled = false;
                    this.innerText = "✅ MARK AS PRESENT";
                });
        });
    </script>
</body>
</html>
