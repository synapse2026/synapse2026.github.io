<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SYNAPSE 2026 | Registration</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <style>
        :root {
            --poster-pink: #d11fb7;
            --poster-blue: #1fc1d1;
            --poster-purple: #741fd1;
            --background-dark: #07060f;
        }

        body { 
            background-color: var(--background-dark);
            color: #fff;
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        #particles-js {
            position: fixed;
            width: 100%; height: 100%;
            top: 0; left: 0; z-index: 1;
            pointer-events: none !important;
        }

        .main-content { position: relative; z-index: 5; padding: 20px; }

        .poster-container {
            max-width: 800px;
            margin: 10px auto 30px auto;
            border-radius: 12px;
            box-shadow: 0 0 30px rgba(116, 31, 209, 0.4);
            border: 2px solid var(--poster-purple);
        }

        .poster-image { width: 100%; height: auto; display: block; border-radius: 10px; }

        .card { 
            background: rgba(15, 12, 41, 0.96);
            border: 1.5px solid #444;
            border-radius: 20px; 
            box-shadow: 0 20px 60px rgba(0,0,0,0.9);
        }

        .form-control, .form-select { background: #fff !important; color: #000 !important; font-weight: 600; }
        .btn-primary { background: linear-gradient(135deg, var(--poster-pink), #741fd1); border: none; padding: 18px; font-weight: 800; }

        /* MINIMAL SUCCESS OVERLAY */
        #successWrapper {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: #000;
            z-index: 9999999 !important; /* Highest possible depth */
            display: none; /* Controlled by JS */
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            text-align: center;
        }

        .success-box {
            width: 100%;
            max-width: 400px;
            padding: 25px;
            border: 2px solid var(--poster-blue);
            border-radius: 15px;
            background: #07060f;
        }

        /* BIG REDESIGNED CLICKABLE BUTTON */
        .btn-download-final {
            background: #1fc1d1 !important;
            color: #000 !important;
            font-weight: 900;
            border: none;
            padding: 22px;
            width: 100%;
            border-radius: 12px;
            font-size: 1.2rem;
            margin-top: 30px;
            cursor: pointer !important;
            display: block;
            text-transform: uppercase;
            box-shadow: 0 10px 30px rgba(31, 193, 209, 0.4);
            pointer-events: auto !important; /* Forces response */
            position: relative;
            z-index: 10000000 !important;
        }

        #qrcode-hidden { display: none; }
    </style>
</head>
<body>

    <div id="particles-js"></div>
    <div id="qrcode-hidden"></div> 

    <div class="main-content container my-4" id="mainUI">
        <div class="poster-container animate__animated animate__fadeIn">
            <img src="synapse-poster.jpg" alt="Synapse 2026 Poster" class="poster-image">
        </div>

        <div class="row justify-content-center">
            <div class="col-lg-7">
                <div class="card p-4 p-md-5">
                    <h2 class="text-center mb-4" style="color: var(--poster-blue); font-weight: 900;">REGISTRATION</h2>
                    <form id="regForm">
                        <div class="mb-3">
                            <label class="form-label fw-bold">Full Name</label>
                            <input type="text" id="name" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Mobile Number</label>
                            <input type="tel" id="mobile" class="form-control" pattern="[0-9]{10}" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">College</label>
                            <input type="text" id="college" class="form-control" required>
                        </div>
                        <div class="row">
                            <div class="col-6 mb-3">
                                <label class="form-label fw-bold">Department</label>
                                <select id="department" class="form-select" required>
                                    <option>CS</option><option>EC</option><option>MECH</option><option>CIVIL</option>
                                </select>
                            </div>
                            <div class="col-6 mb-3">
                                <label class="form-label fw-bold">Semester</label>
                                <select id="semester" class="form-select" required>
                                    <option>S1</option><option>S2</option><option>S4</option><option>S6</option>
                                </select>
                            </div>
                        </div>
                        <button type="submit" id="submitBtn" class="btn btn-primary w-100 mt-4">SUBMIT REGISTRATION</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <div id="successWrapper">
        <div class="success-box animate__animated animate__zoomIn">
            <h1 style="color: var(--poster-blue); font-weight: 900;">SUCCESS!</h1>
            <p class="text-white">Registration confirmed for Synapse 2026.</p>
            <div id="details" class="text-start small text-light border-top border-secondary pt-3 mt-3"></div>
            
            <button id="finalDownloadBtn" onclick="downloadPDF()" class="btn-download-final">
                📥 DOWNLOAD RECEIPT (PDF)
            </button>
            <p class="mt-4 small text-muted">Tap the blue button above to save your QR receipt.</p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>
    <script>
        particlesJS("particles-js", { "particles": { "number": { "value": 30 }, "move": { "speed": 1.5 } } });

        const scriptURL = 'https://script.google.com/macros/s/AKfycbwKjrjjrV5hJUrqaP5nWjYAW2HW50y6EI3_k9bfzriS8ktMuAHpYe1i8K6IyPFV-jsndA/exec';
        let registrationData = {};

        document.getElementById('regForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.innerHTML = "PROCESSING...";

            registrationData = {
                name: document.getElementById('name').value,
                mobile: document.getElementById('mobile').value,
                college: document.getElementById('college').value,
                department: document.getElementById('department').value,
                semester: document.getElementById('semester').value
            };

            fetch(scriptURL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(registrationData) })
            .then(() => showSuccess())
            .catch(() => showSuccess());
        });

        function showSuccess() {
            // Completely hide the main UI to remove any possible interference
            document.getElementById('mainUI').style.display = 'none';
            const wrap = document.getElementById('successWrapper');
            wrap.style.display = 'flex';
            
            document.getElementById('details').innerHTML = `
                <b>Name:</b> ${registrationData.name}<br>
                <b>ID:</b> ${registrationData.mobile}<br>
                <b>College:</b> ${registrationData.college}
            `;
            
            // Optional: Auto-try download after 1 second
            setTimeout(downloadPDF, 1500);
        }

        function downloadPDF() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            const qrContainer = document.getElementById("qrcode-hidden");
            qrContainer.innerHTML = "";

            new QRCode(qrContainer, {
                text: registrationData.mobile,
                width: 256, height: 256
            });

            setTimeout(() => {
                const canvas = qrContainer.querySelector('canvas');
                const qrImg = canvas ? canvas.toDataURL("image/png") : qrContainer.querySelector("img").src;

                doc.setFillColor(7, 6, 15); doc.rect(0, 0, 210, 297, 'F');
                doc.setTextColor(31, 193, 209); doc.setFontSize(26);
                doc.text("SYNAPSE 2026", 105, 40, { align: "center" });
                
                doc.setFillColor(255, 255, 255);
                doc.rect(60, 55, 90, 90, 'F');
                doc.addImage(qrImg, 'PNG', 65, 60, 80, 80);
                
                doc.setTextColor(255, 255, 255);
                doc.setFontSize(14);
                doc.text(`Name: ${registrationData.name}`, 30, 160);
                doc.text(`Mobile: ${registrationData.mobile}`, 30, 175);
                doc.text(`College: ${registrationData.college}`, 30, 190);

                const pdfBlob = doc.output('blob');
                const url = URL.createObjectURL(pdfBlob);
                const link = document.createElement('a');
                link.href = url;
                link.download = `Receipt_${registrationData.name}.pdf`;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                URL.revokeObjectURL(url);
            }, 500);
        }
    </script>
</body>
</html>
