<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Hub | SYNAPSE 2026</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>

    <style>
        :root { --neon-blue: #1fc1d1; --neon-pink: #d11fb7; --dark-bg: #0a0a0f; --warning-gold: #ffc107; }
        body { background: var(--dark-bg); color: #fff; font-family: 'Rajdhani', sans-serif; min-height: 100vh; }
        .container { max-width: 500px; padding: 15px; margin: auto; }
        h3, h5 { font-family: 'Orbitron', sans-serif; letter-spacing: 2px; color: var(--neon-blue); text-shadow: 0 0 10px rgba(31, 193, 209, 0.3); text-transform: uppercase; }
        .section-card { background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 15px; padding: 15px; margin-bottom: 20px; }
        .form-select, .form-control { background: rgba(0,0,0,0.5) !important; color: #fff !important; border: 1px solid #444; }
        .scrollable-container { max-height: 350px; overflow-y: auto; border-bottom: 1px solid rgba(255, 255, 255, 0.1); margin-bottom: 10px; }
        .table thead th { position: sticky; top: 0; background: #0d1117; z-index: 2; color: var(--neon-blue); font-family: 'Orbitron'; font-size: 0.7rem; border-bottom: 2px solid var(--neon-blue); }
        .table { color: #fff; border-color: rgba(255,255,255,0.1); font-size: 0.85rem; }
        .bg-present { background: rgba(46, 213, 115, 0.2); color: #2ed573; border: 1px solid #2ed573; padding: 2px 5px; border-radius: 4px; font-weight: 700; font-size: 0.65rem; }
        .label-cyber { color: var(--neon-blue); font-size: 0.75rem; font-weight: 700; text-transform: uppercase; margin-bottom: 5px; display: block; }
        .btn-cyber { font-family: 'Orbitron', sans-serif; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; }
        .info-sub { color: #aaa; font-size: 0.75rem; line-height: 1.2; display: block; margin-top: 2px; }
        #reader { border: 2px solid var(--neon-pink); border-radius: 15px; overflow: hidden; background: #000; display: none; margin-bottom: 15px; }

        /* Camera UI - 3:4 Aspect Ratio */
        #cameraWrapper { background: #000; border-radius: 15px; padding: 10px; border: 1px solid var(--neon-blue); display: none; margin-top: 15px;}
        #cameraContainer { 
            position: relative; 
            width: 100%; 
            aspect-ratio: 3 / 4; 
            overflow: hidden; 
            background: #000;
            border-radius: 10px;
        }
        #video { width: 100%; height: 100%; object-fit: cover; }
        .camera-overlay { 
            position: absolute; top: 0; left: 0; right: 0; bottom: 0; 
            border: 25px solid rgba(0,0,0,0.7); pointer-events: none; 
        }
        .camera-frame { 
            width: 100%; height: 100%; 
            border: 2px dashed var(--neon-blue); 
            box-shadow: 0 0 15px var(--neon-blue); 
        }
    </style>
</head>
<body>

<div class="container">
    <div class="text-center my-4">
        <h3>EVENT HUB</h3>
        <p class="text-white-50 small" style="font-family: 'Orbitron';">SYNAPSE 2026</p>
    </div>

    <div class="section-card">
        <span class="label-cyber">1. SELECT EVENT</span>
        <select id="eventSelector" class="form-select shadow-none" onchange="fetchParticipants()">
            <option selected disabled>Loading Events...</option>
        </select>
        <div id="loader" class="text-center mt-3 d-none" style="color: var(--neon-blue); font-family: 'Orbitron'; font-size: 0.8rem;">SYNCING DATABASE...</div>
    </div>

    <div class="section-card d-none" id="attendanceSection">
        <h5 class="mb-3" id="eventTitle" style="font-size: 0.9rem;">Paid Attendees</h5>
        <input type="text" id="attendeeSearch" class="form-control mb-3 shadow-none" placeholder="🔍 Search Name or Mobile..." onkeyup="filterTable()">

        <div class="scrollable-container">
            <table class="table table-dark table-hover mb-0" id="participantTable">
                <thead>
                    <tr>
                        <th width="30">SL</th>
                        <th width="30"><input type="checkbox" id="selectAll" onclick="toggleAll(this)"></th>
                        <th>Participant Info</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody id="participantBody"></tbody>
            </table>
        </div>
        
        <div class="mt-2">
            <button class="btn btn-success w-100 mb-2 btn-cyber py-2" onclick="submitBulkAttendance()">✅ Mark Selected Present</button>
            <button class="btn btn-outline-info w-100 btn-cyber py-2" onclick="exportTablePDF('participantTable', 'Attendee_List')">📥 Export Attendee PDF</button>
        </div>
    </div>

    <div class="section-card">
        <h5 class="mb-3" style="font-size: 0.9rem;">🏆 Winner Marking</h5>
        <div id="reader"></div>
        <div class="row g-2">
            <div class="col-12 mb-2">
                <span class="label-cyber">SELECT RANK</span>
                <select id="winnerPosition" class="form-select border-warning shadow-none">
                    <option value="1st Place">1st Place</option>
                    <option value="2nd Place">2nd Place</option>
                    <option value="3rd Place">3rd Place</option>
                </select>
            </div>
            
            <div id="winnerInputArea" class="col-12">
                <div class="row g-2" id="individualWinnerBtns">
                    <div class="col-6">
                        <button onclick="startWinnerScan()" class="btn btn-warning w-100 btn-cyber py-2">📸 SCAN</button>
                    </div>
                    <div class="col-6">
                        <button onclick="handleWinnerManualPrompt()" class="btn btn-outline-warning w-100 btn-cyber py-2">⌨ MANUAL</button>
                    </div>
                </div>
                <div id="teamWinnerArea" class="d-none">
                    <span class="label-cyber">SELECT WINNING TEAM</span>
                    <select id="teamWinnerSelector" class="form-select border-warning mb-2 shadow-none"></select>
                    <button onclick="submitTeamWinner()" class="btn btn-warning w-100 btn-cyber py-2">🏆 MARK TEAM AS WINNER</button>
                </div>
            </div>

            <div class="col-12 mt-3">
                <span class="label-cyber">WINNER MEDIA (PORTRAIT 3:4)</span>
                <button id="camToggleBtn" onclick="openWinnerCamera()" class="btn btn-outline-info w-100 btn-cyber">📷 CAPTURE WINNER PHOTO</button>
                
                <div id="cameraWrapper">
                    <div id="cameraContainer">
                        <video id="video" autoplay playsinline></video>
                        <div class="camera-overlay"><div class="camera-frame"></div></div>
                    </div>
                    <button onclick="capturePhoto()" class="btn btn-info w-100 btn-cyber mt-3 py-2">SNAP & UPLOAD TO DRIVE</button>
                    <button onclick="stopCamera()" class="btn btn-link text-white-50 w-100 mt-2 btn-sm">Cancel Camera</button>
                </div>
                <canvas id="canvas" class="d-none"></canvas>
            </div>
        </div>
    </div>

    <div class="section-card d-none" id="winnerSection">
        <h5 class="mb-3" style="font-size: 0.9rem;">Result Board</h5>
        <div class="table-responsive">
            <table class="table table-bordered border-secondary" id="winnerTable">
                <thead class="table-dark text-warning">
                    <tr><th>Pos</th><th>Winner Info</th></tr>
                </thead>
                <tbody id="winnerBody"></tbody>
            </table>
        </div>
        <button class="btn btn-outline-warning w-100 btn-cyber py-2 mt-2" onclick="exportTablePDF('winnerTable', 'Winners_Report')">📥 Export Winners PDF</button>
    </div>
</div>

<script>
    const scriptURL = 'https://script.google.com/macros/s/AKfycbwKjrjjrV5hJUrqaP5nWjYAW2HW50y6EI3_k9bfzriS8ktMuAHpYe1i8K6IyPFV-jsndA/exec';
    
    const allEvents = ["Glow Craft", "Reverse X", "Trail Blaze", "Brain 2 Bot", "Titan Trials", "Pixel Clash", "Innosense", "Seminar Presentation", "Play villa"];
    const groupEvents = ["Trail Blaze", "Titan Trials", "Innosense"];
    
    const html5QrCode = new Html5Qrcode("reader");
    let currentData = [];
    let videoStream = null;

    window.onload = () => {
        const selector = document.getElementById('eventSelector');
        selector.innerHTML = '<option selected disabled>Choose Event...</option>';
        allEvents.forEach(evt => {
            selector.innerHTML += `<option value="${evt}">${evt}</option>`;
        });
    };

    // --- CAMERA & PHOTO UPLOAD LOGIC ---
    async function openWinnerCamera() {
        const wrapper = document.getElementById('cameraWrapper');
        wrapper.style.display = 'block';
        document.getElementById('camToggleBtn').style.display = 'none';
        
        try {
            // Request 3:4 aspect ratio (Portrait)
            videoStream = await navigator.mediaDevices.getUserMedia({ 
                video: { facingMode: "environment", aspectRatio: 0.75 } 
            });
            document.getElementById('video').srcObject = videoStream;
        } catch (err) {
            alert("Camera Access Error: " + err.message);
            stopCamera();
        }
    }

    function stopCamera() {
        if (videoStream) videoStream.getTracks().forEach(track => track.stop());
        document.getElementById('cameraWrapper').style.display = 'none';
        document.getElementById('camToggleBtn').style.display = 'block';
    }

    function capturePhoto() {
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const context = canvas.getContext('2d');
    const event = document.getElementById('eventSelector').value;
    const pos = document.getElementById('winnerPosition').value;
    const snapBtn = document.querySelector("#cameraWrapper button.btn-info");

    if(!event || event.includes("Choose")) return alert("Please select an event first!");

    // 1. UI Feedback: Disable button and show "Waiting"
    snapBtn.disabled = true;
    snapBtn.innerHTML = `<span class="spinner-border spinner-border-sm"></span> ⌛ UPLOADING... PLEASE WAIT`;
    document.getElementById('loader').classList.remove('d-none');
    document.getElementById('loader').innerText = "PROCESSING IMAGE...";

    // Set portrait dimensions
    canvas.width = 600;
    canvas.height = 800;

    const vW = video.videoWidth;
    const vH = video.videoHeight;
    const targetRatio = 3/4;
    let sX = 0, sY = 0, sW = vW, sH = vH;

    if ((vW / vH) > targetRatio) {
        sW = vH * targetRatio;
        sX = (vW - sW) / 2;
    } else {
        sH = vW / targetRatio;
        sY = (vH - sH) / 2;
    }

    context.drawImage(video, sX, sY, sW, sH, 0, 0, canvas.width, canvas.height);
    const base64Data = canvas.toDataURL('image/jpeg', 0.8);
    
    // Send to server
    uploadPhoto(base64Data, event, pos, snapBtn);
}

function uploadPhoto(img, event, pos, btn) {
    document.getElementById('loader').innerText = "SENDING TO GOOGLE DRIVE...";

    fetch(scriptURL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
            action: "uploadWinnerPhoto",
            image: img,
            event: event,
            position: pos
        })
    }).then(() => {
        // Success Logic
        alert(`✅ SUCCESS!\nPhoto secured for ${event} - ${pos}`);
        document.getElementById('loader').classList.add('d-none');
        
        // Reset Button
        btn.disabled = false;
        btn.innerText = "SNAP & UPLOAD TO DRIVE";
        
        stopCamera();
    }).catch(err => {
        alert("Upload Failed: " + err);
        btn.disabled = false;
        btn.innerText = "SNAP & UPLOAD TO DRIVE";
        document.getElementById('loader').classList.add('d-none');
    });
}
    function uploadPhoto(img, event, pos) {
        document.getElementById('loader').classList.remove('d-none');
        document.getElementById('loader').innerText = "UPLOADING TO DRIVE...";

        fetch(scriptURL, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                action: "uploadWinnerPhoto",
                image: img,
                event: event,
                position: pos
            })
        }).then(() => {
            alert(`SUCCESS: Photo uploaded for ${event} - ${pos}`);
            document.getElementById('loader').classList.add('d-none');
            stopCamera();
        }).catch(err => {
            alert("Error: " + err);
            document.getElementById('loader').classList.add('d-none');
        });
    }

    // --- PRE-EXISTING DATA LOGIC ---
    function fetchParticipants() {
        const event = document.getElementById('eventSelector').value;
        const body = document.getElementById('participantBody');
        const loader = document.getElementById('loader');
        
        loader.classList.remove('d-none');
        loader.innerText = "SYNCING DATABASE...";
        body.innerHTML = "";
        
        if(groupEvents.includes(event)) {
            document.getElementById('individualWinnerBtns').classList.add('d-none');
            document.getElementById('teamWinnerArea').classList.remove('d-none');
        } else {
            document.getElementById('individualWinnerBtns').classList.remove('d-none');
            document.getElementById('teamWinnerArea').classList.add('d-none');
        }

        fetch(`${scriptURL}?action=getEventList&event=${event}`)
            .then(res => res.json())
            .then(data => {
                currentData = data;
                loader.classList.add('d-none');
                document.getElementById('attendanceSection').classList.remove('d-none');
                document.getElementById('winnerSection').classList.remove('d-none');
                document.getElementById('winnerBody').innerHTML = "";

                const teamSet = new Set();
                data.forEach((p, index) => {
                    const allAtt = (p.eventStatus || "").split('|');
                    const isPresentForEvent = allAtt.some(a => a.trim() === event + ": PRESENT");
                    if(isPresentForEvent && p.teamName) teamSet.add(p.teamName);
                    body.innerHTML += `<tr><td>${index+1}</td><td><input type="checkbox" class="user-check form-check-input" value="${p.mobile}" data-name="${p.name}" ${isPresentForEvent ? 'disabled' : ''}></td><td><strong>${p.name}</strong> ${p.teamName ? `<br><small class="text-warning">[${p.teamName}]</small>` : ''}<span class="info-sub">${p.mobile} | ${p.dept}</span><span class="info-sub" style="color: var(--neon-blue)">${p.college}</span></td><td><span class="${isPresentForEvent ? 'bg-present' : 'text-white-50 small'}">${isPresentForEvent ? 'PRESENT' : 'ABSENT'}</span></td></tr>`;
                    if(p.winnerStatus) {
                        const specificWin = p.winnerStatus.split('|').find(win => win.trim().startsWith(event + ":"));
                        if (specificWin) {
                            document.getElementById('winnerBody').innerHTML += `<tr><td class="text-warning fw-bold small">${specificWin.trim()}</td><td><strong>${p.name}</strong><span class="info-sub">${p.mobile} | ${p.dept}</span></td></tr>`;
                        }
                    }
                });

                const teamSelect = document.getElementById('teamWinnerSelector');
                teamSelect.innerHTML = '<option disabled selected>Select Winning Team...</option>';
                teamSet.forEach(t => teamSelect.innerHTML += `<option value="${t}">${t}</option>`);
            });
    }

    function filterTable() {
        const input = document.getElementById('attendeeSearch').value.toUpperCase();
        const rows = document.getElementById('participantBody').getElementsByTagName('tr');
        for (let i = 0; i < rows.length; i++) {
            const text = rows[i].innerText.toUpperCase();
            rows[i].style.display = text.indexOf(input) > -1 ? "" : "none";
        }
    }

    function toggleAll(source) { document.querySelectorAll('.user-check:not([disabled])').forEach(c => c.checked = source.checked); }

    function submitBulkAttendance() {
        const event = document.getElementById('eventSelector').value;
        const selectedElements = Array.from(document.querySelectorAll('.user-check:checked'));
        const mobiles = selectedElements.map(c => c.value);
        const names = selectedElements.map(c => c.getAttribute('data-name'));
        if(mobiles.length === 0) return alert("Select students!");
        let teamName = "";
        if(groupEvents.includes(event)) {
            teamName = prompt(`Assign team for ${event}.\nSelected: ${names.join(", ")}`);
            if(!teamName) return alert("A team name is required for group events.");
        }
        if(!confirm(`Mark ${mobiles.length} participants as PRESENT for ${event}?`)) return;
        const url = `${scriptURL}?action=bulkMarkAttendanceWithTeam&mobiles=${mobiles.join(",")}&event=${event}&team=${encodeURIComponent(teamName)}`;
        fetch(url).then(r => r.text()).then(res => {
            alert(`SUCCESS!\n${event} Attendance Marked.`);
            fetchParticipants();
        });
    }

    function startWinnerScan() {
        const reader = document.getElementById('reader');
        reader.style.display = 'block';
        html5QrCode.start({ facingMode: 'environment' }, { fps: 15, qrbox: 250 }, (mobile) => {
            html5QrCode.stop().then(() => { reader.style.display = 'none'; processWinnerUpdate(mobile); });
        });
    }

    function handleWinnerManualPrompt() {
        const mob = prompt("Enter Participant Mobile:");
        if(mob && mob.length >= 10) processWinnerUpdate(mob);
    }

    function processWinnerUpdate(mobile) {
        const pos = document.getElementById('winnerPosition').value;
        const event = document.getElementById('eventSelector').value;
        fetch(`${scriptURL}?action=markWinner&mobile=${mobile}&position=${pos}&event=${event}`)
            .then(r => r.text()).then(res => { alert(res); fetchParticipants(); });
    }

    function exportTablePDF(tableId, fileName) {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF('l', 'mm', 'a4');
        const event = document.getElementById('eventSelector').value;
        doc.setFontSize(18); doc.setTextColor(31, 193, 209);
        doc.text(`SYNAPSE 2026: ${event}`, 14, 15);
        const rows = [];
        if (tableId === 'participantTable') {
            currentData.forEach((p, i) => {
                const isPresent = (p.eventStatus || "").includes(event + ": PRESENT");
                rows.push([i+1, p.name, p.mobile, p.college, p.dept, p.teamName || 'N/A', isPresent ? 'PRESENT' : 'ABSENT']);
            });
            doc.autoTable({ head: [['SL', 'Name', 'Mobile', 'College', 'Dept', 'Team', 'Status']], body: rows, startY: 25, theme: 'grid', headStyles: { fillColor: [31, 193, 209], textColor: [0, 0, 0] } });
        } else {
            currentData.forEach((p, i) => {
                if(p.winnerStatus) {
                    const specificWin = p.winnerStatus.split('|').find(w => w.trim().startsWith(event + ":"));
                    if(specificWin) rows.push([rows.length + 1, specificWin.trim(), p.name, p.mobile, p.college, p.teamName || 'N/A']);
                }
            });
            doc.autoTable({ head: [['SL', 'Position', 'Name', 'Mobile', 'College', 'Team']], body: rows, startY: 25, theme: 'grid', headStyles: { fillColor: [255, 193, 7], textColor: [0, 0, 0] } });
        }
        doc.save(`${fileName}_${event}.pdf`);
    }
</script>
</body>
</html>
