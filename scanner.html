<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scanner | SYNAPSE 2026</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
    <style>
        body { background: #07060f; color: #fff; font-family: sans-serif; }
        .container { max-width: 500px; padding: 20px; }
        #reader { border: 3px solid #1fc1d1; border-radius: 20px; overflow: hidden; background: #000; }
        .detail-card { background: rgba(15, 12, 41, 0.98); border-radius: 15px; padding: 25px; margin-top: 20px; display: none; border: 2px solid #1fc1d1; }
        .label { color: #1fc1d1; font-size: 0.75rem; font-weight: bold; text-transform: uppercase; margin-top: 8px; }
        .val { font-size: 1rem; border-bottom: 1px solid #333; padding-bottom: 4px; overflow-wrap: break-word; }
        .badge-status { padding: 8px 20px; border-radius: 25px; font-weight: 800; display: inline-block; margin-top: 15px; width: 100%; }
        .bg-red { background: #ff4757; color: #fff; }
        .bg-green { background: #2ed573; color: #000; }
    </style>
</head>
<body>
    <div class="container text-center">
        <h3 class="mb-4" style="color: #1fc1d1; font-weight: 800;">STAFF GATE CONTROL</h3>
        <div id="reader"></div>
        <div class="mt-4" id="controls">
            <button onclick="html5QrCode.start({ facingMode: 'environment' }, { fps: 20, qrbox: 250 }, onScanSuccess)" class="btn btn-info w-100 py-3 fw-bold">📸 SCAN QR CODE</button>
            <label for="qr-input" class="btn btn-outline-warning w-100 mt-2 py-2 fw-bold">🖼️ UPLOAD PHOTO</label>
            <input type="file" id="qr-input" accept="image/*" capture="environment" style="display:none">
        </div>

        <div id="result" class="detail-card text-start">
            <h5 class="text-center" style="color: #d11fb7; font-weight: 900;">STUDENT INFO</h5>
            <div class="label">Name</div><div id="d-name" class="val">-</div>
            <div class="label">Mobile</div><div id="d-mobile" class="val">-</div>
            <div class="label">Events</div><div id="d-events" class="val">-</div>
            
            <div id="statusArea" class="mt-3 text-center">
                <div id="p-badge" class="badge-status">Checking...</div>
                <button id="confirmBtn" class="btn btn-primary w-100 mt-3 py-3 fw-bold">MARK PAYMENT & ENTRY</button>
                <div id="alreadyVerifiedMsg" class="mt-3 text-success fw-bold d-none">✓ ENTRY ALREADY VERIFIED</div>
            </div>
            <button class="btn btn-link text-white-50 w-100 mt-2" onclick="location.reload()">Back</button>
        </div>
    </div>

    <script>
        const scriptURL = 'https://script.google.com/macros/s/AKfycbwKjrjjrV5hJUrqaP5nWjYAW2HW50y6EI3_k9bfzriS8ktMuAHpYe1i8K6IyPFV-jsndA/exec';
        const html5QrCode = new Html5Qrcode("reader");
        let currentMob = "";

        const handleData = (mobile) => {
            currentMob = mobile.trim();
            document.getElementById('controls').style.display = 'none';
            document.getElementById('result').style.display = 'block';
            
            fetch(`${scriptURL}?action=search&mobile=${currentMob}`)
                .then(res => res.json())
                .then(data => {
                    if (data === "NotFound") { alert("Not Found!"); location.reload(); return; }
                    
                    document.getElementById('d-name').innerText = data.name;
                    document.getElementById('d-mobile').innerText = data.mobile;
                    document.getElementById('d-events').innerText = data.events;
                    
                    const badge = document.getElementById('p-badge');
                    const btn = document.getElementById('confirmBtn');
                    const msg = document.getElementById('alreadyVerifiedMsg');

                    if (data.payment === "COMPLETED") {
                        badge.innerText = "PAYMENT: COMPLETED";
                        badge.className = "badge-status bg-green";
                        btn.classList.add('d-none');
                        msg.classList.remove('d-none');
                    } else {
                        badge.innerText = "PAYMENT: PENDING";
                        badge.className = "badge-status bg-red";
                        btn.classList.remove('d-none');
                        msg.classList.add('d-none');
                    }
                });
        };

        const onScanSuccess = (t) => { navigator.vibrate(200); if(html5QrCode.isScanning) html5QrCode.stop(); handleData(t); };
        document.getElementById('qr-input').addEventListener('change', e => {
            html5QrCode.scanFileV2(e.target.files[0], true).then(res => handleData(res.decodedText));
        });

        document.getElementById('confirmBtn').addEventListener('click', function() {
            this.disabled = true; this.innerText = "UPDATING...";
            fetch(`${scriptURL}?action=updatePayment&mobile=${currentMob}`)
                .then(r => r.text()).then(() => { alert("Entry Successful!"); location.reload(); });
        });
    </script>
</body>
</html>
