<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Hub | SYNAPSE 2026</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>

    <style>
        :root { --neon-blue: #1fc1d1; --neon-pink: #d11fb7; --dark-bg: #0a0a0f; --warning-gold: #ffc107; }
        body { background: var(--dark-bg); color: #fff; font-family: 'Rajdhani', sans-serif; min-height: 100vh; }
        .container { max-width: 500px; padding: 15px; margin: auto; }
        h3, h5 { font-family: 'Orbitron', sans-serif; letter-spacing: 2px; color: var(--neon-blue); text-shadow: 0 0 10px rgba(31, 193, 209, 0.3); text-transform: uppercase; }
        .section-card { background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 15px; padding: 15px; margin-bottom: 20px; }
        .form-select, .form-control { background: rgba(0,0,0,0.5) !important; color: #fff !important; border: 1px solid #444; }
        .scrollable-container { max-height: 350px; overflow-y: auto; border-bottom: 1px solid rgba(255, 255, 255, 0.1); margin-bottom: 10px; }
        .table { color: #fff; border-color: rgba(255,255,255,0.1); font-size: 0.85rem; }
        .label-cyber { color: var(--neon-blue); font-size: 0.75rem; font-weight: 700; text-transform: uppercase; margin-bottom: 5px; display: block; }
        .btn-cyber { font-family: 'Orbitron', sans-serif; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; }
        
        /* 3:4 PORTRAIT CAMERA UI WITH ENHANCEMENTS */
        #cameraWrapper { background: #000; border-radius: 15px; padding: 10px; border: 1px solid var(--neon-blue); display: none; margin-top: 15px;}
        #cameraContainer { 
            position: relative; 
            width: 100%; 
            aspect-ratio: 3 / 4; 
            overflow: hidden; 
            background: #000;
            border-radius: 10px;
        }
        #video { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
            /* Color Enhancements */
            filter: saturate(1.25) brightness(1.1) contrast(1.1); 
        }
        .camera-overlay { 
            position: absolute; top: 0; left: 0; right: 0; bottom: 0; 
            border: 20px solid rgba(0,0,0,0.6); pointer-events: none; 
        }
        .camera-frame { 
            width: 100%; height: 100%; 
            border: 2px dashed var(--neon-blue); 
            box-shadow: 0 0 15px rgba(31, 193, 209, 0.4); 
        }
        #reader { border: 2px solid var(--neon-pink); border-radius: 15px; overflow: hidden; display: none; margin-bottom: 15px; }
    </style>
</head>
<body>

<div class="container">
    <div class="text-center my-4">
        <h3>EVENT HUB</h3>
        <p class="text-white-50 small" style="font-family: 'Orbitron';">SYNAPSE 2026</p>
    </div>

    <div class="section-card">
        <span class="label-cyber">1. SELECT EVENT</span>
        <select id="eventSelector" class="form-select shadow-none" onchange="fetchParticipants()">
            <option selected disabled>Loading Events...</option>
        </select>
        <div id="loader" class="text-center mt-3 d-none" style="color: var(--neon-blue); font-family: 'Orbitron'; font-size: 0.8rem;">SYNCING...</div>
    </div>

    <div class="section-card d-none" id="attendanceSection">
        <h5 class="mb-3" id="eventTitle" style="font-size: 0.9rem;">Attendees</h5>
        <div class="scrollable-container">
            <table class="table table-dark table-hover mb-0" id="participantTable">
                <tbody id="participantBody"></tbody>
            </table>
        </div>
        <button class="btn btn-success w-100 mb-2 btn-cyber" onclick="submitBulkAttendance()">✅ Mark Present</button>
    </div>

    <div class="section-card">
        <h5 class="mb-3" style="font-size: 0.9rem;">🏆 Winner Marking</h5>
        <div id="reader"></div>
        <div class="row g-2">
            <div class="col-12 mb-2">
                <span class="label-cyber">SELECT RANK</span>
                <select id="winnerPosition" class="form-select border-warning shadow-none">
                    <option value="1st Place">1st Place</option>
                    <option value="2nd Place">2nd Place</option>
                    <option value="3rd Place">3rd Place</option>
                </select>
            </div>
            
            <div class="col-6"><button onclick="startWinnerScan()" class="btn btn-warning w-100 btn-cyber">📸 SCAN QR</button></div>
            <div class="col-6"><button onclick="handleWinnerManualPrompt()" class="btn btn-outline-warning w-100 btn-cyber">⌨ MANUAL</button></div>

            <div class="col-12 mt-4">
                <span class="label-cyber">WINNER MEDIA (PORTRAIT 3:4)</span>
                <button id="camToggleBtn" onclick="openWinnerCamera()" class="btn btn-outline-info w-100 btn-cyber">📷 OPEN CAMERA</button>
                
                <div id="cameraWrapper">
                    <div id="cameraContainer">
                        <video id="video" autoplay playsinline></video>
                        <div class="camera-overlay"><div class="camera-frame"></div></div>
                    </div>
                    <button id="captureBtn" onclick="capturePhoto()" class="btn btn-info w-100 btn-cyber mt-3 py-2">SNAP & UPLOAD</button>
                    <button onclick="stopCamera()" class="btn btn-link text-white-50 w-100 mt-2 btn-sm">Close Camera</button>
                </div>
            </div>
        </div>
    </div>

    <div class="section-card d-none" id="winnerSection">
        <h5 class="mb-3" style="font-size: 0.9rem;">Result Board</h5>
        <table class="table table-bordered border-secondary" id="winnerTable">
            <tbody id="winnerBody"></tbody>
        </table>
    </div>

    <canvas id="canvas" class="d-none"></canvas>
</div>

<script>
    const scriptURL = 'YOUR_APPS_SCRIPT_URL_HERE'; 
    const allEvents = ["Glow Craft", "Reverse X", "Trail Blaze", "Brain 2 Bot", "Titan Trials", "Pixel Clash", "Innosense", "Seminar Presentation", "Play villa"];
    
    let videoStream = null;
    const html5QrCode = new Html5Qrcode("reader");

    window.onload = () => {
        const selector = document.getElementById('eventSelector');
        selector.innerHTML = '<option selected disabled>Choose Event...</option>';
        allEvents.forEach(evt => selector.innerHTML += `<option value="${evt}">${evt}</option>`);
    };

    // --- ENHANCED CAMERA LOGIC ---
    async function openWinnerCamera() {
        const wrapper = document.getElementById('cameraWrapper');
        wrapper.style.display = 'block';
        document.getElementById('camToggleBtn').style.display = 'none';
        
        try {
            videoStream = await navigator.mediaDevices.getUserMedia({ 
                video: { 
                    facingMode: "environment", 
                    aspectRatio: 0.75,
                    width: { ideal: 1920 }, // High res request
                    height: { ideal: 2560 }
                } 
            });
            document.getElementById('video').srcObject = videoStream;
        } catch (err) {
            alert("Camera Error: " + err.message);
            stopCamera();
        }
    }

    function stopCamera() {
        if (videoStream) videoStream.getTracks().forEach(track => track.stop());
        document.getElementById('cameraWrapper').style.display = 'none';
        document.getElementById('camToggleBtn').style.display = 'block';
    }

    function capturePhoto() {
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const context = canvas.getContext('2d');
        const btn = document.getElementById('captureBtn');
        const event = document.getElementById('eventSelector').value;
        const pos = document.getElementById('winnerPosition').value;

        if(!event || event.includes("Choose")) return alert("Select event first!");

        // 1. High Resolution Output (1200x1600)
        canvas.width = 1200;
        canvas.height = 1600;
        context.imageSmoothingEnabled = true;
        context.imageSmoothingQuality = 'high';

        // 2. Crop logic
        const vW = video.videoWidth;
        const vH = video.videoHeight;
        const targetRatio = 3/4;
        let sX = 0, sY = 0, sW = vW, sH = vH;

        if ((vW / vH) > targetRatio) {
            sW = vH * targetRatio;
            sX = (vW - sW) / 2;
        } else {
            sH = vW / targetRatio;
            sY = (vH - sH) / 2;
        }

        // 3. Draw with CSS-like filters manually applied via canvas if needed, 
        // but browsers usually bake 'filter' into drawImage if applied to the video element.
        context.filter = 'saturate(1.25) brightness(1.1) contrast(1.1)';
        context.drawImage(video, sX, sY, sW, sH, 0, 0, canvas.width, canvas.height);
        
        const imageData = canvas.toDataURL('image/jpeg', 0.9);
        
        // 4. RESET BUTTON IMMEDIATELY for the next capture
        btn.innerText = "UPLOADING...";
        btn.disabled = true;

        uploadPhoto(imageData, event, pos, btn);
    }

    function uploadPhoto(img, event, pos, btn) {
        document.getElementById('loader').classList.remove('d-none');
        document.getElementById('loader').innerText = "DRIVE UPLOAD IN PROGRESS...";

        fetch(scriptURL, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                action: "uploadWinnerPhoto",
                image: img,
                event: event,
                position: pos
            })
        }).then(() => {
            alert(`✅ Photo Secured for ${pos}`);
            document.getElementById('loader').classList.add('d-none');
            // Reset button state for next winner
            btn.disabled = false;
            btn.innerText = "SNAP & UPLOAD NEXT";
        }).catch(err => {
            alert("Upload Error: " + err);
            btn.disabled = false;
            btn.innerText = "RETRY SNAP";
        });
    }

    // --- DATA LOGIC ---
    function fetchParticipants() {
        const event = document.getElementById('eventSelector').value;
        document.getElementById('loader').classList.remove('d-none');
        fetch(`${scriptURL}?action=getEventList&event=${event}`)
            .then(res => res.json())
            .then(data => {
                document.getElementById('loader').classList.add('d-none');
                document.getElementById('attendanceSection').classList.remove('d-none');
                document.getElementById('winnerSection').classList.remove('d-none');
                const body = document.getElementById('participantBody');
                const winnerBody = document.getElementById('winnerBody');
                body.innerHTML = ""; winnerBody.innerHTML = "";
                data.forEach(p => {
                    const isPresent = (p.eventStatus || "").includes(event + ": PRESENT");
                    body.innerHTML += `<tr><td><input type="checkbox" class="user-check" value="${p.mobile}" ${isPresent?'disabled':''}></td><td>${p.name}<br><small>${p.mobile}</small></td></tr>`;
                    if(p.winnerStatus && p.winnerStatus.includes(event)) {
                        winnerBody.innerHTML += `<tr><td class="text-warning">${p.winnerStatus}</td><td>${p.name}</td></tr>`;
                    }
                });
            });
    }

    function startWinnerScan() {
        const reader = document.getElementById('reader');
        reader.style.display = 'block';
        html5QrCode.start({ facingMode: 'environment' }, { fps: 10, qrbox: 250 }, (mobile) => {
            html5QrCode.stop().then(() => { reader.style.display = 'none'; processWinnerUpdate(mobile); });
        });
    }

    function handleWinnerManualPrompt() {
        const mob = prompt("Enter Participant Mobile:");
        if(mob) processWinnerUpdate(mob);
    }

    function processWinnerUpdate(mobile) {
        const pos = document.getElementById('winnerPosition').value;
        const event = document.getElementById('eventSelector').value;
        fetch(`${scriptURL}?action=markWinner&mobile=${mobile}&position=${pos}&event=${event}`)
            .then(r => r.text()).then(res => { alert(res); fetchParticipants(); });
    }
</script>
</body>
</html>
