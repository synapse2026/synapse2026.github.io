<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MENTOR CAM | SYNAPSE 2026</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root { --neon-blue: #1fc1d1; --neon-pink: #d11fb7; --dark-bg: #07060f; }
        
        body, html { 
            margin: 0; padding: 0; height: 100%; width: 100%;
            background-color: var(--dark-bg); color: #fff; 
            font-family: 'Rajdhani', sans-serif; overflow: hidden; 
        }

        #particles-js { position: fixed; width: 100%; height: 100%; z-index: 1; }

        /* Initial Vertical UI */
        .setup-wrapper { 
            position: relative; z-index: 10; display: flex; flex-direction: column; 
            align-items: center; justify-content: center; height: 100vh; padding: 20px;
        }

        #setup-form { 
            background: rgba(255,255,255,0.05); border: 2px solid var(--neon-blue); 
            padding: 30px; border-radius: 20px; backdrop-filter: blur(15px); width: 100%; max-width: 400px; 
        }

        /* --- THE ROTATION MAGIC --- */
        .landscape-mode {
            position: fixed; top: 0; left: 0; width: 100vh; height: 100vw;
            transform: rotate(90deg); transform-origin: top left;
            left: 100vw; z-index: 100; background: var(--dark-bg);
            display: none; flex-direction: row; align-items: center; justify-content: center;
            padding: 20px; box-sizing: border-box;
        }

        #camera-container { 
            width: 70%; aspect-ratio: 16 / 9; 
            border: 4px solid var(--neon-pink); border-radius: 15px; 
            overflow: hidden; position: relative; background: #000;
        }

        video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
        #preview-img { width: 100%; height: 100%; object-fit: contain; display: none; }

        .controls-sidebar {
            width: 25%; display: flex; flex-direction: column; 
            gap: 15px; padding-left: 20px;
        }

        .btn-capture { 
            background: linear-gradient(135deg, var(--neon-pink), #741fd1); 
            font-family: 'Orbitron'; font-weight: 700; border: none; padding: 20px; 
            border-radius: 50%; width: 80px; height: 80px; font-size: 1.5rem;
            box-shadow: 0 0 20px var(--neon-pink); align-self: center;
        }

        .btn-upload {
            background: #28a745; font-family: 'Orbitron'; border: none;
            padding: 12px; border-radius: 10px; color: #fff; font-weight: bold;
        }

        .viewfinder-overlay { position: absolute; inset: 0; border: 2px solid var(--neon-blue); pointer-events: none; }
        
        .form-control, .form-select { background: rgba(0, 0, 0, 0.6) !important; color: #fff !important; border: 1px solid #444; margin-bottom: 15px; }

        .flash { position: fixed; inset: 0; background: white; opacity: 0; pointer-events: none; z-index: 9999; }
    </style>
</head>
<body>
    <div id="particles-js"></div>
    <div id="flash-effect" class="flash"></div>

    <div class="setup-wrapper" id="vertical-ui">
        <h2 style="font-family:'Orbitron'; color:var(--neon-blue); margin-bottom:20px;">MENTOR PORTAL</h2>
        <div id="setup-form">
            <input type="text" id="stuName" class="form-control" placeholder="FULL NAME">
            <select id="stuDept" class="form-select">
                <option value="" disabled selected>BRANCH</option>
                <option value="CT">Computer Engineering</option>
                <option value="EC">Electronics</option>
                <option value="IE">Instrumentation</option>
                <option value="CABM">CABM</option>
            </select>
            <select id="stuSem" class="form-select">
                <option value="" disabled selected>SEMESTER</option>
                <option value="S1">S1</option><option value="S2">S2</option>
                <option value="S3">S3</option><option value="S4">S4</option>
                <option value="S5">S5</option><option value="S6">S6</option>
            </select>
            <button onclick="switchToLandscape()" class="btn btn-info w-100 fw-bold py-3" style="font-family:'Orbitron'">GO TO CAMERA</button>
            <p class="text-center text-info small mt-3">Rotate phone for best view after clicking</p>
        </div>
    </div>

    <div class="landscape-mode" id="horizontal-ui">
        <div id="camera-container">
            <video id="video" autoplay playsinline></video>
            <div class="viewfinder-overlay"></div>
            <img id="preview-img">
        </div>

        <div class="controls-sidebar">
            <div id="status-text" style="font-size:0.8rem; color:var(--neon-blue); font-family:'Orbitron';">READY</div>
            <button id="captureBtn" onclick="takePhoto()" class="btn-capture">📸</button>
            
            <div id="upload-group" style="display:none; flex-direction:column; gap:10px;">
                <button onclick="uploadPhoto()" class="btn-upload">UPLINK 2K</button>
                <button onclick="location.reload()" class="btn btn-sm btn-outline-light">RETAKE</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>
    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzb97bG3GTT1wMH7M9j8RDXkoqoFD_MWXFkUZS0przdUO51s-7Zyutn0FbRSRnjjH8X5A/exec";
        let stream;

        async function switchToLandscape() {
            if(!document.getElementById('stuName').value) return alert("Enter name!");
            
            // Toggle UI
            document.getElementById('vertical-ui').style.display = 'none';
            const horiz = document.getElementById('horizontal-ui');
            horiz.style.display = 'flex';

            // Attempt to lock orientation (Chrome/Android)
            try {
                if (screen.orientation && screen.orientation.lock) {
                    await screen.orientation.lock('landscape');
                }
            } catch(e) { console.log("Orientation lock not supported"); }

            startCam();
        }

        async function startCam() {
            try {
                stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: "user", width: { ideal: 3840 }, height: { ideal: 2160 } } 
                });
                document.getElementById('video').srcObject = stream;
            } catch (err) { alert("Camera Error: " + err.message); }
        }

        function takePhoto() {
            // Flash Effect
            const flash = document.getElementById('flash-effect');
            flash.style.opacity = '1';
            setTimeout(() => { flash.style.opacity = '0'; }, 150);

            const video = document.getElementById('video');
            const canvas = document.createElement('canvas');
            
            // FORCED 2K LANDSCAPE RESOLUTION
            canvas.width = 2560;
            canvas.height = 1440;
            const ctx = canvas.getContext('2d');

            const vW = video.videoWidth;
            const vH = video.videoHeight;
            const targetAspect = 16/9;
            let sX, sY, sW, sH;

            if ((vW/vH) > targetAspect) {
                sW = vH * targetAspect; sH = vH; sX = (vW - sW) / 2; sY = 0;
            } else {
                sW = vW; sH = vW / targetAspect; sX = 0; sY = (vH - sH) / 2;
            }

            // Draw and Mirror Correct
            ctx.translate(canvas.width, 0);
            ctx.scale(-1, 1);
            ctx.drawImage(video, sX, sY, sW, sH, 0, 0, canvas.width, canvas.height);
            
            const dataUrl = canvas.toDataURL('image/jpeg', 0.9);
            
            // UI Update
            video.style.display = 'none';
            const preview = document.getElementById('preview-img');
            preview.src = dataUrl;
            preview.style.display = 'block';
            document.getElementById('captureBtn').style.display = 'none';
            document.getElementById('upload-group').style.display = 'flex';
            document.getElementById('status-text').innerText = "SNAP SECURED";
        }

        async function uploadPhoto() {
            const status = document.getElementById('status-text');
            status.innerText = "UPLINKING...";
            
            const blob = document.getElementById('preview-img').src.split(',')[1];
            const meta = {
                name: document.getElementById('stuName').value,
                dept: document.getElementById('stuDept').value,
                sem: document.getElementById('stuSem').value
            };

            fetch(SCRIPT_URL, {
                method: "POST",
                mode: "no-cors",
                body: JSON.stringify({ action: "mentorSelfie", img: blob, ...meta })
            }).then(() => {
                alert("Uplink Successful!");
                location.reload();
            });
        }

        particlesJS("particles-js", {
            "particles": {
                "number": { "value": 40 },
                "color": { "value": ["#d11fb7", "#1fc1d1"] },
                "opacity": { "value": 0.3 },
                "size": { "value": 3 },
                "line_linked": { "enable": true, "distance": 150, "color": "#1fc1d1", "opacity": 0.2, "width": 1 },
                "move": { "enable": true, "speed": 2 }
            }
        });
    </script>
</body>
</html>
