<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Hub | SYNAPSE 2026</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>

    <style>
        :root { --neon-blue: #1fc1d1; --neon-pink: #d11fb7; --dark-bg: #0a0a0f; --warning-gold: #ffc107; }
        body { background: var(--dark-bg); color: #fff; font-family: 'Rajdhani', sans-serif; min-height: 100vh; }
        .container { max-width: 500px; padding: 15px; margin: auto; }
        h3, h5 { font-family: 'Orbitron', sans-serif; letter-spacing: 2px; color: var(--neon-blue); text-shadow: 0 0 10px rgba(31, 193, 209, 0.3); text-transform: uppercase; }
        .section-card { background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 15px; padding: 15px; margin-bottom: 20px; }
        .form-select, .form-control { background: rgba(0,0,0,0.5) !important; color: #fff !important; border: 1px solid #444; }
        .scrollable-container { max-height: 350px; overflow-y: auto; border-bottom: 1px solid rgba(255, 255, 255, 0.1); margin-bottom: 10px; }
        .table { color: #fff; border-color: rgba(255,255,255,0.1); font-size: 0.85rem; }
        .bg-present { background: rgba(46, 213, 115, 0.2); color: #2ed573; border: 1px solid #2ed573; padding: 2px 5px; border-radius: 4px; font-weight: 700; font-size: 0.65rem; }
        .label-cyber { color: var(--neon-blue); font-size: 0.75rem; font-weight: 700; text-transform: uppercase; margin-bottom: 5px; display: block; }
        .btn-cyber { font-family: 'Orbitron', sans-serif; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; }
        .info-sub { color: #aaa; font-size: 0.75rem; line-height: 1.2; display: block; margin-top: 2px; }
        
        #cameraWrapper { background: #000; border-radius: 15px; padding: 10px; border: 1px solid var(--neon-blue); display: none; margin-top: 15px;}
        #cameraContainer { position: relative; width: 100%; overflow: hidden; background: #000; border-radius: 10px; }
        
        /* FIX: DYNAMIC SCREEN BOXES */
        .portrait-frame { aspect-ratio: 3 / 4 !important; }
        .landscape-frame { aspect-ratio: 4 / 3 !important; }

        #video { width: 100%; height: 100%; object-fit: cover; }
        .camera-overlay { position: absolute; top: 0; left: 0; right: 0; bottom: 0; border: 20px solid rgba(0,0,0,0.6); pointer-events: none; }
        .camera-frame { width: 100%; height: 100%; border: 2px dashed var(--neon-blue); }
        
        /* Gallery Styles */
        .winner-gallery { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 15px; }
        .gallery-item { position: relative; border-radius: 10px; overflow: hidden; border: 1px solid var(--neon-blue); aspect-ratio: 3/4; background: #222; }
        .gallery-item.landscape { aspect-ratio: 4/3; }
        .gallery-item img { width: 100%; height: 100%; object-fit: cover; }
        .gallery-tag { position: absolute; bottom: 0; background: rgba(0,0,0,0.8); color: var(--neon-blue); width: 100%; font-size: 0.6rem; padding: 2px 5px; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <div class="text-center my-4">
        <h3>EVENT HUB</h3>
        <p class="text-white-50 small" style="font-family: 'Orbitron';">SYNAPSE 2026</p>
    </div>

    <div class="section-card">
        <span class="label-cyber">1. SELECT EVENT</span>
        <select id="eventSelector" class="form-select shadow-none" onchange="fetchParticipants()">
            <option selected disabled>Loading Events...</option>
        </select>
        <div id="loader" class="text-center mt-3 d-none" style="color: var(--neon-blue); font-family: 'Orbitron'; font-size: 0.8rem;">SYNCING...</div>
    </div>

    <div class="section-card d-none" id="attendanceSection">
        <h5 class="mb-3" style="font-size: 0.9rem;">Paid Attendees List</h5>
        <div class="scrollable-container">
            <table class="table table-dark table-hover mb-0" id="participantTable">
                <thead><tr><th width="30">SL</th><th width="30"><input type="checkbox" onclick="toggleAll(this)"></th><th>Info</th><th>Status</th></tr></thead>
                <tbody id="participantBody"></tbody>
            </table>
        </div>
        <button id="markAttBtn" class="btn btn-success w-100 mb-2 btn-cyber py-2" onclick="submitBulkAttendance()">✅ Mark Selected Present</button>
    </div>

    <div class="section-card">
        <h5 class="mb-3" style="font-size: 0.9rem;">🏆 Winner Marking</h5>
        <div id="reader" style="display:none; border:2px solid var(--neon-pink); border-radius:15px; margin-bottom:15px; overflow:hidden;"></div>
        <div class="row g-2">
            <div class="col-12 mb-2">
                <span class="label-cyber">SELECT RANK</span>
                <select id="winnerPosition" class="form-select border-warning shadow-none">
                    <option value="1st Place">1st Place</option>
                    <option value="2nd Place">2nd Place</option>
                    <option value="3rd Place">3rd Place</option>
                </select>
            </div>
            
            <div id="winnerInputArea" class="col-12">
                <div class="row g-2" id="individualWinnerBtns">
                    <div class="col-6"><button id="scanBtn" onclick="startWinnerScan()" class="btn btn-warning w-100 btn-cyber py-2">📸 SCAN</button></div>
                    <div class="col-6"><button onclick="handleWinnerManualPrompt()" class="btn btn-outline-warning w-100 btn-cyber py-2">⌨ MANUAL</button></div>
                </div>
                <div id="teamWinnerArea" class="d-none">
                    <span class="label-cyber">SELECT WINNING TEAM</span>
                    <select id="teamWinnerSelector" class="form-select border-warning mb-2 shadow-none"></select>
                    <button id="teamWinnerBtn" onclick="submitTeamWinner()" class="btn btn-warning w-100 btn-cyber py-2">🏆 MARK TEAM AS WINNER</button>
                </div>
            </div>

            <div class="col-12 mt-4 text-center">
                <button id="camToggleBtn" onclick="openWinnerCamera()" class="btn btn-outline-info w-100 btn-cyber">📷 OPEN CAMERA</button>
                <div id="cameraWrapper">
                    <div id="cameraContainer">
                        <video id="video" autoplay playsinline></video>
                        <div class="camera-overlay"><div class="camera-frame"></div></div>
                    </div>
                    <button id="captureBtn" onclick="capturePhoto()" class="btn btn-info w-100 btn-cyber mt-3 py-2">SNAP & UPLOAD</button>
                    <button onclick="stopCamera()" class="btn btn-link text-white-50 w-100 mt-2 btn-sm">Cancel</button>
                </div>
            </div>
        </div>
    </div>

    <div class="section-card d-none" id="winnerSection">
        <h5 class="mb-3" style="font-size: 0.9rem;">Result Board</h5>
        <div class="table-responsive">
            <table class="table table-bordered border-secondary" id="winnerTable">
                <tbody id="winnerBody"></tbody>
            </table>
        </div>
        <button class="btn btn-outline-warning w-100 btn-cyber py-2 mt-2" onclick="exportTablePDF('winnerTable', 'Winners_Report')">📥 Export Winners PDF</button>
        
        <h5 class="mt-4 mb-2" style="font-size: 0.7rem; color: #aaa;">EVENT MEDIA PREVIEW</h5>
        <div id="winnerGallery" class="winner-gallery"></div>
    </div>
</div>

<canvas id="canvas" class="d-none"></canvas>

<script>
    const scriptURL = 'https://script.google.com/macros/s/AKfycbzb97bG3GTT1wMH7M9j8RDXkoqoFD_MWXFkUZS0przdUO51s-7Zyutn0FbRSRnjjH8X5A/exec';
    let currentData = [];
    let videoStream = null;
    const allEvents = ["Glow Craft", "Reverse X", "Trail Blaze", "Brain 2 Bot", "Titan Trials", "Pixel Clash", "Innosense", "Seminar Presentation", "Play villa"];
    const groupEvents = ["Trail Blaze", "Titan Trials", "Innosense"];
    const html5QrCode = new Html5Qrcode("reader");

    window.onload = () => {
        const selector = document.getElementById('eventSelector');
        selector.innerHTML = '<option selected disabled>Choose Event...</option>';
        allEvents.forEach(evt => selector.innerHTML += `<option value="${evt}">${evt}</option>`);
    };

    function fetchParticipants() {
        const event = document.getElementById('eventSelector').value;
        const loader = document.getElementById('loader');
        loader.classList.remove('d-none');
        loader.innerText = "SYNCING DATABASE...";

        if(groupEvents.includes(event)) {
            document.getElementById('individualWinnerBtns').classList.add('d-none');
            document.getElementById('teamWinnerArea').classList.remove('d-none');
        } else {
            document.getElementById('individualWinnerBtns').classList.remove('d-none');
            document.getElementById('teamWinnerArea').classList.add('d-none');
        }

        fetch(`${scriptURL}?action=getEventList&event=${event}`)
            .then(res => res.json())
            .then(data => {
                currentData = data;
                loader.classList.add('d-none');
                document.getElementById('attendanceSection').classList.remove('d-none');
                document.getElementById('winnerSection').classList.remove('d-none');
                const body = document.getElementById('participantBody');
                const winnerBody = document.getElementById('winnerBody');
                const teamSelect = document.getElementById('teamWinnerSelector');
                body.innerHTML = ""; winnerBody.innerHTML = "";
                teamSelect.innerHTML = '<option disabled selected>Select Winning Team...</option>';

                const teamSet = new Set();
                data.forEach((p, index) => {
                    const isPresent = (p.eventStatus || "").includes(event + ": PRESENT");
                    if(isPresent && p.teamName) teamSet.add(p.teamName);

                    body.innerHTML += `<tr>
                        <td>${index + 1}</td>
                        <td><input type="checkbox" class="user-check" value="${p.mobile}" data-name="${p.name}" ${isPresent ? 'disabled' : ''}></td>
                        <td><strong>${p.name}</strong> ${p.teamName ? `<br><small class="text-warning">[${p.teamName}]</small>` : ''}<span class="info-sub">${p.mobile} | ${p.dept}</span><span class="info-sub" style="color:var(--neon-blue)">${p.college}</span></td>
                        <td><span class="${isPresent ? 'bg-present' : 'text-white-50 small'}">${isPresent ? 'PRESENT' : 'ABSENT'}</span></td>
                    </tr>`;
                    
                    if(p.winnerStatus && p.winnerStatus.includes(event)) {
                        const rank = p.winnerStatus.split('|').find(s => s.includes(event));
                        winnerBody.innerHTML += `<tr><td class="text-warning fw-bold">${rank}</td><td><strong>${p.name}</strong> ${p.teamName ? `[${p.teamName}]` : ''}<span class="info-sub">${p.mobile} | ${p.college}</span></td></tr>`;
                    }
                });
                teamSet.forEach(t => teamSelect.innerHTML += `<option value="${t}">${t}</option>`);
                loadGallery(event);
            });
    }

   function loadGallery(eventName) {
    const gallery = document.getElementById('winnerGallery');
    gallery.innerHTML = "<div class='text-center w-100'><p class='small text-white-50'>🔍 Scanning Drive for media...</p></div>";
    
    fetch(`${scriptURL}?action=getLiveTVData`)
        .then(res => res.json())
        .then(data => {
            gallery.innerHTML = "";
            const isGroup = groupEvents.includes(eventName);
            
            // Clean names for matching (remove spaces/special chars)
            const cleanEventName = eventName.toLowerCase().replace(/\s+/g, '');

            const filteredPhotos = data.photos.filter(url => {
                const cleanUrl = url.toLowerCase();
                // Match "Trail Blaze", "Trail_Blaze", or "trailblaze"
                return cleanUrl.includes(eventName.toLowerCase().replace(/ /g, "_")) || 
                       cleanUrl.includes(eventName.toLowerCase().replace(/ /g, "%20")) ||
                       cleanUrl.includes(cleanEventName);
            });

            if(filteredPhotos.length > 0) {
                // Show latest photos first
                filteredPhotos.reverse().forEach(url => {
                    gallery.innerHTML += `
                        <div class="gallery-item ${isGroup ? 'landscape' : ''}">
                            <img src="${url}" alt="Winner" onerror="this.src='https://placehold.co/400x600?text=Private+File'">
                            <div class="gallery-tag">${eventName}</div>
                        </div>`;
                });
            } else {
                gallery.innerHTML = "<div class='text-center w-100'><p class='small text-white-50'>No photos found for this event yet.</p></div>";
            }
        })
        .catch(err => {
            gallery.innerHTML = "<p class='small text-danger'>Gallery Sync Error</p>";
        });
}

    async function openWinnerCamera() {
        const event = document.getElementById('eventSelector').value;
        const wrapper = document.getElementById('cameraWrapper');
        const container = document.getElementById('cameraContainer');
        const isGroup = groupEvents.includes(event);
        
        container.className = isGroup ? "landscape-frame" : "portrait-frame";
        wrapper.style.display = 'block';
        document.getElementById('camToggleBtn').style.display = 'none';

        try {
            videoStream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: "environment", aspectRatio: isGroup ? 1.3333 : 0.75, width: { ideal: 3000 }, height: { ideal: 3000 } }
            });
            document.getElementById('video').srcObject = videoStream;
        } catch (e) {
            videoStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
            document.getElementById('video').srcObject = videoStream;
        }
    }

    function capturePhoto() {
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const event = document.getElementById('eventSelector').value;
        const pos = document.getElementById('winnerPosition').value;
        const btn = document.getElementById('captureBtn');
        const isGroup = groupEvents.includes(event);

        canvas.width = isGroup ? 3200 : 2400;
        canvas.height = isGroup ? 2400 : 3200;
        const context = canvas.getContext('2d');
        context.imageSmoothingEnabled = true;
        context.imageSmoothingQuality = 'high';

        const targetRatio = isGroup ? 4/3 : 3/4;
        let sX = 0, sY = 0, sW = video.videoWidth, sH = video.videoHeight;
        if ((sW / sH) > targetRatio) { sW = sH * targetRatio; sX = (video.videoWidth - sW) / 2; }
        else { sH = sW / targetRatio; sY = (video.videoHeight - sH) / 2; }

        context.drawImage(video, sX, sY, sW, sH, 0, 0, canvas.width, canvas.height);
        btn.innerText = "⌛ UPLOADING..."; btn.disabled = true;

        fetch(scriptURL, {
            method: "POST",
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            body: JSON.stringify({ action: "uploadWinnerPhoto", image: canvas.toDataURL('image/jpeg', 0.9), event: event, position: pos })
        }).then(() => {
            alert(`✅ Photo Secured!`);
            btn.disabled = false; btn.innerText = "SNAP & UPLOAD";
            stopCamera();
            fetchParticipants();
        });
    }

    function submitBulkAttendance() {
        const event = document.getElementById('eventSelector').value;
        const selected = Array.from(document.querySelectorAll('.user-check:checked'));
        const mobiles = selected.map(c => c.value);
        const names = selected.map(c => c.getAttribute('data-name'));
        if(!mobiles.length) return alert("Select students!");
        let teamName = groupEvents.includes(event) ? prompt(`Enter Team Name for: ${names.join(", ")}`) : "";
        if(groupEvents.includes(event) && !teamName) return alert("Team name mandatory!");
        document.getElementById('markAttBtn').innerText = "⌛ UPDATING...";
        fetch(`${scriptURL}?action=bulkMarkAttendanceWithTeam&mobiles=${mobiles.join(",")}&event=${event}&team=${encodeURIComponent(teamName)}`)
            .then(() => { alert("Attendance Updated!"); fetchParticipants(); });
    }

    function submitTeamWinner() {
        const team = document.getElementById('teamWinnerSelector').value;
        const pos = document.getElementById('winnerPosition').value;
        const event = document.getElementById('eventSelector').value;
        if(!team || team.includes("Select")) return alert("Select team!");
        document.getElementById('teamWinnerBtn').innerText = "⌛ UPDATING...";
        fetch(`${scriptURL}?action=markTeamWinner&team=${encodeURIComponent(team)}&position=${pos}&event=${event}`)
            .then(() => { alert("Winners Marked!"); fetchParticipants(); });
    }

    function stopCamera() {
        if (videoStream) videoStream.getTracks().forEach(track => track.stop());
        document.getElementById('cameraWrapper').style.display = 'none';
        document.getElementById('camToggleBtn').style.display = 'block';
    }

    function toggleAll(source) { document.querySelectorAll('.user-check:not([disabled])').forEach(c => c.checked = source.checked); }
    function filterTable() {
        const input = document.getElementById('attendeeSearch').value.toUpperCase();
        const rows = document.getElementById('participantBody').getElementsByTagName('tr');
        for (let i = 0; i < rows.length; i++) {
            const text = rows[i].innerText.toUpperCase();
            rows[i].style.display = text.indexOf(input) > -1 ? "" : "none";
        }
    }

    function startWinnerScan() {
        const reader = document.getElementById('reader'); reader.style.display = 'block';
        html5QrCode.start({ facingMode: 'environment' }, { fps: 15, qrbox: 250 }, (mobile) => {
            html5QrCode.stop().then(() => { reader.style.display = 'none'; processWinnerUpdate(mobile); });
        });
    }

    function handleWinnerManualPrompt() {
        const mob = prompt("Enter Mobile:"); if(mob) processWinnerUpdate(mob);
    }

    function processWinnerUpdate(mobile) {
        const pos = document.getElementById('winnerPosition').value;
        const event = document.getElementById('eventSelector').value;
        const participant = currentData.find(p => String(p.mobile) === String(mobile));
        if(!participant) return alert("Not found!");
        if(!(participant.eventStatus || "").includes(event + ": PRESENT")) return alert("Mark Present First!");
        document.getElementById('loader').classList.remove('d-none');
        fetch(`${scriptURL}?action=markWinner&mobile=${mobile}&position=${pos}&event=${event}`)
            .then(() => { alert("Winner Marked!"); fetchParticipants(); });
    }

    function exportTablePDF(tableId, fileName) {
        const { jsPDF } = window.jspdf; const doc = new jsPDF('l', 'mm', 'a4');
        const event = document.getElementById('eventSelector').value;
        doc.text(`SYNAPSE 2026: ${event} Report`, 14, 15);
        const rows = [];
        if (tableId === 'participantTable') {
            currentData.forEach((p, i) => {
                const isPresent = (p.eventStatus || "").includes(event + ": PRESENT");
                rows.push([i+1, p.name, p.mobile, p.college, p.dept, p.teamName || 'N/A', isPresent ? 'PRESENT' : 'ABSENT']);
            });
            doc.autoTable({ head: [['SL', 'Name', 'Mobile', 'College', 'Dept', 'Team', 'Status']], body: rows, startY: 25 });
        } else {
            currentData.forEach((p, i) => {
                if(p.winnerStatus && p.winnerStatus.includes(event)) {
                    rows.push([rows.length+1, p.winnerStatus.split('|').find(s => s.includes(event)).trim(), p.name, p.mobile, p.college, p.teamName || 'N/A']);
                }
            });
            doc.autoTable({ head: [['SL', 'Rank', 'Winner Name', 'Mobile', 'College', 'Team']], body: rows, startY: 25 });
        }
        doc.save(`${fileName}_${event}.pdf`);
    }
</script>
</body>
</html>
