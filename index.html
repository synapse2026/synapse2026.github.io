<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SYNAPSE 2026 | Debug Scanner</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>

    <style>
        body { background: #07060f; color: #fff; font-family: sans-serif; font-size: 14px; }
        .scanner-container { max-width: 500px; margin: auto; padding: 20px; }
        #reader { width: 100%; border-radius: 20px; overflow: hidden; border: 3px solid #1fc1d1 !important; background: #000; }
        
        .btn-start { background: #1fc1d1; color: #000; font-weight: 900; border: none; padding: 15px; width: 100%; border-radius: 10px; margin-bottom: 10px; }
        .btn-upload { background: #ffc107; color: #000; font-weight: 900; border: none; padding: 15px; width: 100%; border-radius: 10px; display: block; margin-bottom: 10px; text-align: center; }
        
        /* Debug Console Styling */
        .debug-console { 
            background: #111; 
            border: 1px solid #333; 
            color: #0f0; 
            font-family: monospace; 
            padding: 10px; 
            height: 150px; 
            overflow-y: auto; 
            font-size: 11px; 
            margin-top: 20px;
            border-radius: 8px;
            text-align: left;
        }

        .result-card, .manual-card { background: rgba(15, 12, 41, 0.98); border-radius: 15px; padding: 25px; margin-top: 20px; display: none; border: 2px solid #1fc1d1; }
        #qr-input-file { display: none; }
    </style>
</head>
<body>

    <div class="scanner-container text-center">
        <h2 class="my-4" style="color: #1fc1d1; font-weight: 900; letter-spacing: 2px;">SYNAPSE SCANNER</h2>
        
        <div id="reader"></div>
        <div id="status" class="mt-2 text-info small">Status: Waiting</div>

        <div class="controls mt-4">
            <button id="startBtn" class="btn-start">📸 START LIVE CAMERA</button>
            <label for="qr-input-file" class="btn-upload">🖼️ PHOTO VERIFY</label>
            <input type="file" id="qr-input-file" accept="image/*" capture="environment">
            <button class="btn btn-outline-secondary w-100 text-white-50 btn-sm" onclick="location.reload()">Reload Page</button>
        </div>

        <div class="debug-console" id="debugLog">
            > Debug Console Initialized...<br>
        </div>

        <div id="result" class="result-card text-start">
            <h4 style="color: #1fc1d1;">✓ VERIFIED</h4>
            <div id="scannedData" class="my-3"></div>
            <button id="checkinBtn" class="btn btn-primary w-100 fw-bold">MARK PRESENT</button>
        </div>
    </div>

    <script>
        const scriptURL = 'https://script.google.com/macros/s/AKfycbwKjrjjrV5hJUrqaP5nWjYAW2HW50y6EI3_k9bfzriS8ktMuAHpYe1i8K6IyPFV-jsndA/exec'; // MUST BE YOUR GOOGLE SCRIPT URL
        const html5QrCode = new Html5Qrcode("reader");
        const logBox = document.getElementById('debugLog');
        const statusText = document.getElementById('status');
        let currentMobile = "";

        function log(msg) {
            const time = new Date().toLocaleTimeString().split(' ')[0];
            logBox.innerHTML += `[${time}] ${msg}<br>`;
            logBox.scrollTop = logBox.scrollHeight;
            console.log(msg);
        }

        const onScanSuccess = (decodedText) => {
            log("SUCCESS: QR decoded successfully.");
            navigator.vibrate(200);
            document.getElementById('result').style.display = 'block';
            document.getElementById('scannedData').innerHTML = decodedText.replaceAll('|', '<br>');
            const match = decodedText.match(/Mobile:\s*(\d{10})/);
            currentMobile = match ? match[1] : "";
            if (html5QrCode.isScanning) html5QrCode.stop();
        };

        // 1. Live Mode
        document.getElementById('startBtn').addEventListener('click', () => {
            log("ACTION: Starting live camera...");
            html5QrCode.start({ facingMode: "environment" }, { fps: 20, qrbox: 280 }, onScanSuccess)
            .then(() => log("CAMERA: Live feed active."))
            .catch(err => log("ERROR: Camera failed - " + err));
        });

        // 2. Photo Mode with Logs
        document.getElementById('qr-input-file').addEventListener('change', e => {
            if (e.target.files.length == 0) return;
            const file = e.target.files[0];
            log(`FILE: Received ${file.name} (${Math.round(file.size/1024)}KB)`);
            
            const reader = new FileReader();
            reader.onload = function(f) {
                log("FILE: Data read complete. Loading Image object...");
                const img = new Image();
                img.onload = function() {
                    log(`IMG: Dimensions ${img.width}x${img.height}. Scaling...`);
                    const canvas = document.createElement('canvas');
                    const scale = 800 / img.width;
                    canvas.width = 800;
                    canvas.height = img.height * scale;
                    
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    log("IMG: Scaling complete. Starting QR Analysis...");
                    
                    html5QrCode.scanFileV2(canvas, true)
                    .then(res => {
                        log("ANALYSIS: Data found in image.");
                        onScanSuccess(res.decodedText);
                    })
                    .catch(err => {
                        log("ANALYSIS: No QR pattern detected in this image.");
                    });
                };
                img.src = f.target.result;
            };
            reader.onerror = () => log("ERROR: Failed to read file.");
            reader.readAsDataURL(file);
        });

        document.getElementById('checkinBtn').addEventListener('click', function() {
            log("ACTION: Sending Check-in to Google Sheets...");
            this.disabled = true;
            fetch(`${scriptURL}?action=checkin&mobile=${currentMobile}`)
            .then(res => res.text()).then(res => { 
                log("SHEET: " + res);
                alert(res); 
                location.reload(); 
            })
            .catch(err => {
                log("SHEET ERROR: " + err);
                this.disabled = false;
            });
        });
    </script>
</body>
</html>
