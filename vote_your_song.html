<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SYNAPSE 2026 | Crowd DJ</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    
    <style>
        :root {
            --poster-pink: #d11fb7;
            --poster-blue: #1fc1d1;
            --poster-purple: #741fd1;
            --background-dark: #07060f;
            --card-bg: rgba(255, 255, 255, 0.05);
        }

        body, html {
            background-color: var(--background-dark);
            color: #fff;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            margin: 0;
            overflow-x: hidden;
        }

        #particles-js {
            position: fixed;
            width: 100%;
            height: 100%;
            z-index: 1;
            top: 0;
            left: 0;
            pointer-events: none;
        }

        /* --- THEMED HEADER --- */
        .navbar {
            background: rgba(7, 6, 15, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(31, 193, 209, 0.2);
            z-index: 1000;
            position: sticky;
            top: 0;
        }

        .navbar-brand {
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            color: white !important;
            text-shadow: 0 0 10px var(--poster-blue);
            letter-spacing: 2px;
        }

        .hero-title {
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            color: var(--poster-pink);
            text-transform: uppercase;
            letter-spacing: 4px;
            text-align: center;
            margin-top: 30px;
            text-shadow: 0 0 15px rgba(209, 31, 183, 0.5);
        }

        /* --- SONG CARDS --- */
        .song-card {
            background: var(--card-bg);
            border: 1px solid rgba(31, 193, 209, 0.2);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 15px;
            backdrop-filter: blur(10px);
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            position: relative;
            z-index: 10;
        }

        .song-card:hover {
            border-color: var(--poster-pink);
            transform: translateY(-3px);
            box-shadow: 0 0 20px rgba(209, 31, 183, 0.3);
        }

        .song-title {
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            color: #fff;
            margin-bottom: 2px;
        }

        .song-artist {
            color: var(--poster-blue);
            font-size: 0.85rem;
            letter-spacing: 1px;
        }

        .vote-count {
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            color: var(--poster-pink);
            font-size: 1.4rem;
        }

        /* --- VOTE BUTTON --- */
        .btn-vote {
            background: linear-gradient(135deg, var(--poster-blue), var(--poster-purple));
            border: none;
            border-radius: 8px;
            color: white;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            padding: 10px 20px;
            box-shadow: 0 0 15px rgba(31, 193, 209, 0.4);
            transition: 0.3s;
        }

        .btn-vote:hover:not(:disabled) {
            box-shadow: 0 0 25px rgba(209, 31, 183, 0.6);
            transform: scale(1.05);
        }

        .btn-vote:disabled {
            background: #444;
            opacity: 0.7;
        }

        /* --- PULSE ANIMATION --- */
        .pulse-up {
            animation: pulse-pink 0.6s ease-out;
        }

        @keyframes pulse-pink {
            0% { transform: scale(1); text-shadow: 0 0 0px var(--poster-pink); }
            50% { transform: scale(1.3); text-shadow: 0 0 20px var(--poster-pink); }
            100% { transform: scale(1); text-shadow: 0 0 0px var(--poster-pink); }
        }

        footer {
            text-align: center;
            padding: 40px 20px;
            font-size: 0.7rem;
            color: #6c757d;
            letter-spacing: 2px;
            position: relative;
            z-index: 10;
        }

        .powered-by {
            color: var(--poster-blue);
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div id="particles-js"></div>

    <nav class="navbar">
        <div class="container justify-content-center">
            <span class="navbar-brand">SYNAPSE <span style="color:var(--poster-pink)">26</span></span>
        </div>
    </nav>

    <div class="container mt-4 mb-5">
        <h2 class="hero-title animate__animated animate__fadeInDown">CROWD DJ Control</h2>
        <p class="text-center text-secondary mb-5 small">VOTE FOR THE NEXT TRACK TO PLAY IN THE MAIN HALL</p>

        <div id="poll-container" class="row justify-content-center">
            <div class="text-center py-5">
                <div class="spinner-border text-info" role="status"></div>
                <p class="mt-3 text-info font-monospace">SYNCING WITH DJ BOOTH...</p>
            </div>
        </div>
    </div>

    <footer>
        <p>WEBSITE POWERED BY TEAM CT, GRWPC<br>
        DEVELOPED BY <a href="mailto:sarangsukumar@gmail.com" class="powered-by">SARANGSUKUMAR@GMAIL.COM</a></p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>
    <script>
        // Particles JS (Matched to your Registration Page)
        particlesJS("particles-js", {
            "particles": {
                "number": { "value": 40 },
                "color": { "value": ["#d11fb7", "#1fc1d1"] },
                "shape": { "type": "circle" },
                "opacity": { "value": 0.4 },
                "size": { "value": 2.5 },
                "line_linked": { "enable": true, "distance": 120, "color": "#741fd1", "opacity": 0.3, "width": 1 },
                "move": { "enable": true, "speed": 1.5 }
            }
        });

        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzb97bG3GTT1wMH7M9j8RDXkoqoFD_MWXFkUZS0przdUO51s-7Zyutn0FbRSRnjjH8X5A/exec"; 
        let userVoted = false;

        async function loadSongs(isUpdate = false) {
            try {
                const response = await fetch(`${SCRIPT_URL}?action=getAllSongs`);
                const songs = await response.json();
                const container = document.getElementById('poll-container');
                
                if(isUpdate) {
                    songs.forEach(song => {
                        const safeId = song.uri.replace(/:/g, '');
                        const el = document.getElementById(`count-${safeId}`);
                        if(el && el.innerText != song.votes) {
                            el.innerText = song.votes;
                            el.classList.add('pulse-up');
                            setTimeout(() => el.classList.remove('pulse-up'), 700);
                        }
                    });
                    return;
                }

                container.innerHTML = '';
                songs.forEach((song, index) => {
                    const safeId = song.uri.replace(/:/g, '');
                    container.innerHTML += `
                        <div class="col-12 col-md-8 col-lg-6">
                            <div class="song-card d-flex align-items-center justify-content-between animate__animated animate__fadeInUp" style="animation-delay: ${index * 0.1}s">
                                <div>
                                    <div class="song-title">${song.name}</div>
                                    <div class="song-artist">${song.artist}</div>
                                    <div class="mt-2">
                                        <span id="count-${safeId}" class="vote-count">${song.votes}</span>
                                        <span style="color:var(--poster-blue); font-size: 0.7rem; margin-left:5px;">VOTES</span>
                                    </div>
                                </div>
                                <button class="btn btn-vote" onclick="castVote('${song.uri}', this, '${safeId}')">
                                    VOTE
                                </button>
                            </div>
                        </div>`;
                });
            } catch (e) { console.error(e); }
        }

        async function castVote(uri, btn, safeId) {
            if(userVoted) {
                alert("You've already influenced the vibe for this round!");
                return;
            }
            if (window.navigator.vibrate) window.navigator.vibrate(50);

            btn.disabled = true;
            btn.innerHTML = '...';
            
            try {
                const url = `${SCRIPT_URL}?action=voteSong&songUri=${encodeURIComponent(uri)}`;
                const response = await fetch(url);
                const result = await response.text();
                
                if (result === "Vote Recorded") {
                    userVoted = true;
                    btn.innerHTML = "DONE";
                    const countEl = document.getElementById(`count-${safeId}`);
                    countEl.innerText = parseInt(countEl.innerText) + 1;
                    countEl.classList.add('pulse-up');
                    setTimeout(() => loadSongs(true), 1000);
                }
            } catch (e) {
                btn.disabled = false;
                btn.innerHTML = "VOTE";
            }
        }

        loadSongs();
        setInterval(() => loadSongs(true), 15000);
    </script>
</body>
</html>
