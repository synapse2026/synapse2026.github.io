<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SYNAPSE 2026 | Staff Scanner</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>

    <style>
        body { background: #07060f; color: #fff; font-family: sans-serif; }
        .scanner-container { max-width: 500px; margin: auto; padding: 20px; }
        #reader { border-radius: 20px; overflow: hidden; border: 2px solid #1fc1d1 !important; }
        .result-card { background: rgba(15, 12, 41, 0.95); border-radius: 15px; padding: 25px; margin-top: 20px; display: none; border: 2px solid #d11fb7; }
        .btn-checkin { background: #1fc1d1; color: #000; font-weight: 800; border: none; padding: 15px; width: 100%; border-radius: 10px; }
    </style>
</head>
<body>

    <div class="scanner-container text-center">
        <h2 class="my-4" style="color: #1fc1d1; font-weight: 900;">SYNAPSE SCANNER</h2>
        <div id="reader"></div>

        <div id="result" class="result-card text-start">
            <h4 style="color: #d11fb7;">STUDENT FOUND</h4>
            <hr>
            <div id="scannedData" class="mb-4"></div>
            
            <button id="checkinBtn" class="btn-checkin mb-3">✅ MARK AS PRESENT</button>
            <button class="btn btn-outline-secondary w-100 text-white" onclick="resetScanner()">Cancel / Next</button>
        </div>
    </div>

    <script>
        const scriptURL = 'https://script.google.com/macros/s/AKfycbwKjrjjrV5hJUrqaP5nWjYAW2HW50y6EI3_k9bfzriS8ktMuAHpYe1i8K6IyPFV-jsndA/exec'; // MUST BE YOUR GOOGLE SCRIPT URL
        const html5QrCode = new Html5Qrcode("reader");
        let currentMobile = "";

        const onScanSuccess = (decodedText) => {
            html5QrCode.stop().then(() => {
                document.getElementById('result').style.display = 'block';
                document.getElementById('scannedData').innerHTML = decodedText.replaceAll('|', '<br>');
                
                // Extract mobile number (assuming it follows "Mobile: ")
                const match = decodedText.match(/Mobile:\s*(\d{10})/);
                currentMobile = match ? match[1] : "";
            });
        };

        html5QrCode.start({ facingMode: "environment" }, { fps: 15, qrbox: 250 }, onScanSuccess);

        document.getElementById('checkinBtn').addEventListener('click', function() {
            this.disabled = true;
            this.innerText = "UPDATING SHEET...";
            
            fetch(`${scriptURL}?action=checkin&mobile=${currentMobile}`)
                .then(res => res.text())
                .then(response => {
                    alert("Attendance Marked: " + response);
                    resetScanner();
                })
                .catch(err => alert("Error: " + err));
        });

        function resetScanner() {
            document.getElementById('result').style.display = 'none';
            document.getElementById('checkinBtn').disabled = false;
            document.getElementById('checkinBtn').innerText = "✅ MARK AS PRESENT";
            html5QrCode.start({ facingMode: "environment" }, { fps: 15, qrbox: 250 }, onScanSuccess);
        }
    </script>
</body>
</html>
