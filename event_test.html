<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scanner | SYNAPSE 2026</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <style>
        :root {
            --neon-blue: #1fc1d1;
            --neon-pink: #d11fb7;
            --dark-bg: #0a0a0f;
            --warning-gold: #ffc107;
        }

        body { 
            background: var(--dark-bg); 
            color: #fff; 
            font-family: 'Rajdhani', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
        }

        .container { max-width: 450px; padding: 25px; margin: auto; }

        h3 { 
            font-family: 'Orbitron', sans-serif; 
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(31, 193, 209, 0.5);
            font-weight: 700;
        }

        #reader { 
            border: 2px solid var(--neon-blue); 
            border-radius: 15px; 
            overflow: hidden; 
            background: #000;
        }

        .control-panel {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 20px;
            margin-top: 20px;
        }

        .form-control {
            background: rgba(0,0,0,0.5) !important;
            color: #fff !important;
            border: 1px solid #444;
            font-size: 1.2rem;
        }

        .detail-card { 
            background: linear-gradient(145deg, #0f0c29, #1a1a2e); 
            border-radius: 20px; 
            padding: 25px; 
            margin-top: 20px; 
            display: none; 
            border: 1px solid var(--neon-pink);
            box-shadow: 0 0 30px rgba(209, 31, 183, 0.2);
        }

        .label { color: var(--neon-blue); font-size: 0.8rem; font-weight: 700; text-transform: uppercase; margin-top: 12px; }
        .val { font-size: 1.1rem; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 5px; margin-bottom: 5px;}
        
        /* Checkbox List Styling */
        #event-checkbox-container {
            background: rgba(255,255,255,0.05);
            border-radius: 10px;
            padding: 10px;
            margin-top: 10px;
            border: 1px solid rgba(31, 193, 209, 0.3);
            max-height: 200px;
            overflow-y: auto;
        }

        .event-item {
            display: flex;
            align-items: center;
            padding: 10px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            cursor: pointer;
        }

        .event-item:hover { background: rgba(31, 193, 209, 0.1); }

        .event-item input[type="checkbox"] {
            width: 22px;
            height: 22px;
            margin-right: 15px;
            cursor: pointer;
        }

        .badge-status { 
            padding: 12px; border-radius: 10px; font-weight: 800; 
            display: inline-block; margin-top: 20px; width: 100%; 
            font-family: 'Orbitron', sans-serif; font-size: 0.85rem;
        }

        .bg-red { background: rgba(255, 71, 87, 0.2); color: #ff4757; border: 1px solid #ff4757; }
        .bg-green { background: rgba(46, 213, 115, 0.2); color: #2ed573; border: 1px solid #2ed573; }
        .bg-process { background: rgba(255, 193, 7, 0.1); color: var(--warning-gold); border: 1px solid var(--warning-gold); }
        
        #qr-preview-area { background: #fff; padding: 15px; border-radius: 10px; display: inline-block; margin: 10px 0; }
    </style>
</head>
<body>

    <div class="container text-center">
        <h3 class="mb-4" style="color: var(--neon-blue);">GATE CONTROL</h3>
        
        <div id="reader"></div>

        <div id="controls">
            <button onclick="startScanner()" class="btn btn-info w-100 py-3 mt-4 mb-3 fw-bold">📸 OPEN SCANNER</button>
            
            <div class="control-panel">
                <div class="d-flex justify-content-between mb-2">
                    <span class="small text-white-50">MANUAL OVERRIDE</span>
                    <span id="digit-count" class="text-white-50">0/10</span>
                </div>
                <div class="input-group">
                    <input type="tel" id="manual-mobile" class="form-control" placeholder="Phone Number" maxlength="10">
                    <button onclick="handleManualSearch()" class="btn btn-warning px-3 fw-bold">SEARCH</button>
                </div>
            </div>
        </div>

        <div id="result" class="detail-card text-start">
            <h5 class="text-center mb-1" style="color: var(--neon-pink); font-family: 'Orbitron';">VERIFICATION</h5>
            
            <div id="qr-display-section" class="text-center d-none border-bottom border-secondary mb-3">
                <div id="qr-preview-area"></div>
            </div>

            <div id="infoFields">
                <div class="label">Attendee Name</div><div id="d-name" class="val">-</div>
                <div class="label">Mobile Number</div><div id="d-mobile" class="val">-</div>
                <div class="label">Registered Events</div><div id="d-events" class="val">-</div>
                
                <div id="add-event-wrapper" class="mt-3">
                    <div class="d-flex justify-content-between align-items-center">
                        <span class="label" style="color: var(--warning-gold);">Add New Events</span>
                        <span id="selected-count" class="badge bg-info text-dark">0 Selected</span>
                    </div>
                    <div id="event-checkbox-container">
                        </div>
                </div>
            </div>
            
            <div id="statusArea" class="text-center">
                <div id="p-badge" class="badge-status">INITIALIZING...</div>
                <button id="confirmBtn" class="btn btn-primary w-100 mt-3 py-3 fw-bold d-none">MARK ENTRY & PAYMENT</button>
                <div id="alreadyVerifiedMsg" class="mt-3 text-success fw-bold d-none">✓ ENTRY GRANTED</div>
            </div>
            
            <button class="btn btn-link text-white-50 w-100 mt-3 text-decoration-none" onclick="location.reload()">← BACK TO HOME</button>
        </div>
    </div>

    <script>
        const scriptURL = 'https://script.google.com/macros/s/AKfycbwKjrjjrV5hJUrqaP5nWjYAW2HW50y6EI3_k9bfzriS8ktMuAHpYe1i8K6IyPFV-jsndA/exec';
        const html5QrCode = new Html5Qrcode("reader");
        let currentMob = "";

        // MUST MATCH SPREADSHEET EXACTLY
        const MASTER_EVENT_LIST = ["Event 1", "Event 2", "Event 3", "Workshop", "Paper Presentation", "Coding Battle"];

        document.getElementById('manual-mobile').addEventListener('input', e => {
            const len = e.target.value.length;
            const counter = document.getElementById('digit-count');
            counter.innerText = `${len}/10`;
            counter.style.color = (len === 10) ? '#2ed573' : '#aaa';
        });

        function startScanner() {
            html5QrCode.start({ facingMode: 'environment' }, { fps: 20, qrbox: 250 }, onScanSuccess)
                .catch(() => alert("Camera error. Please allow permissions."));
        }

        function handleManualSearch() {
            const val = document.getElementById('manual-mobile').value.trim();
            if(val.length < 10) return alert("Please enter 10 digits");
            handleData(val);
        }

        const handleData = (mobile) => {
            currentMob = mobile.trim();
            document.getElementById('controls').style.display = 'none';
            document.getElementById('result').style.display = 'block';
            
            const badge = document.getElementById('p-badge');
            badge.innerText = "SEARCHING DATABASE...";
            badge.className = "badge-status bg-process";

            fetch(`${scriptURL}?action=search&mobile=${currentMob}`)
                .then(res => res.text())
                .then(responseText => {
                    if (responseText === "NotFound") {
                        badge.innerText = "NOT REGISTERED";
                        badge.className = "badge-status bg-red";
                        return;
                    }

                    const data = JSON.parse(responseText);
                    document.getElementById('d-name').innerText = data.name;
                    document.getElementById('d-mobile').innerText = data.mobile;
                    document.getElementById('d-events').innerText = data.events;
                    
                    // Build Checkboxes
                    const container = document.getElementById('event-checkbox-container');
                    container.innerHTML = "";
                   // Replace the checkbox loop inside handleData in your HTML
const registered = data.events.split(',').map(e => e.trim().toLowerCase()); // Cleaned array

let count = 0;
MASTER_EVENT_LIST.forEach((evt, i) => {
    // Case-insensitive check to see if they are already registered
    if (!registered.includes(evt.trim().toLowerCase())) {
        const item = document.createElement('div');
        item.className = "event-item";
        item.innerHTML = `
            <input type="checkbox" class="event-chk-input" value="${evt}" id="chk_${i}" onchange="updateCount()">
            <label for="chk_${i}" style="width:100%; cursor:pointer; margin-bottom:0; padding-left:10px;">${evt}</label>
        `;
        container.appendChild(item);
        count++;
    }
});

                    const qrArea = document.getElementById("qr-preview-area");
                    qrArea.innerHTML = "";
                    new QRCode(qrArea, { text: data.mobile, width: 160, height: 160 });
                    document.getElementById('qr-display-section').classList.remove('d-none');

                    if (data.payment === "COMPLETED") {
                        badge.innerText = "PAID & VERIFIED";
                        badge.className = "badge-status bg-green";
                        document.getElementById('alreadyVerifiedMsg').classList.remove('d-none');
                        document.getElementById('add-event-wrapper').style.display = 'none';
                    } else {
                        badge.innerText = "PAYMENT PENDING";
                        badge.className = "badge-status bg-red";
                        document.getElementById('confirmBtn').classList.remove('d-none');
                    }
                });
        };

        function updateCount() {
            const selected = document.querySelectorAll('.event-chk-input:checked').length;
            document.getElementById('selected-count').innerText = `${selected} Selected`;
        }

        const onScanSuccess = (t) => { 
            if(html5QrCode.isScanning) html5QrCode.stop(); 
            handleData(t); 
        };

        document.getElementById('confirmBtn').addEventListener('click', function() {
            const checkedBoxes = document.querySelectorAll('.event-chk-input:checked');
            const selectedEvents = Array.from(checkedBoxes).map(cb => cb.value);
            
            this.disabled = true; 
            this.innerText = "UPDATING...";

            let finalUrl = `${scriptURL}?action=updatePayment&mobile=${currentMob}`;
            if (selectedEvents.length > 0) {
                finalUrl += `&newEvents=${encodeURIComponent(selectedEvents.join(','))}`;
            }

            fetch(finalUrl)
                .then(r => r.text())
                .then(() => { 
                    alert("Success! Payment recorded and events updated."); 
                    location.reload(); 
                })
                .catch(() => {
                    alert("Error updating record.");
                    this.disabled = false;
                    this.innerText = "MARK ENTRY & PAYMENT";
                });
        });
    </script>
</body>
</html>
