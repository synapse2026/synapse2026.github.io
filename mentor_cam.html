<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MENTOR CAM | SYNAPSE 2026</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root { --neon-blue: #1fc1d1; --neon-pink: #d11fb7; --dark-bg: #07060f; }
        body { background: var(--dark-bg); color: #fff; font-family: 'Rajdhani', sans-serif; min-height: 100vh; }
        .hero-title { font-family: 'Orbitron'; color: var(--neon-blue); text-align: center; margin-top: 20px; letter-spacing: 2px; }
        #camera-container { width: 100%; max-width: 400px; margin: 20px auto; border: 3px solid var(--neon-pink); border-radius: 20px; overflow: hidden; position: relative; aspect-ratio: 3/4; background: #000; }
        video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); /* Mirror effect for selfie */ }
        canvas { display: none; }
        .btn-capture { background: linear-gradient(135deg, var(--neon-pink), #741fd1); color: white; font-family: 'Orbitron'; font-weight: 700; border: none; padding: 15px; border-radius: 50px; box-shadow: 0 0 20px rgba(209, 31, 183, 0.5); }
        .form-control { background: rgba(255,255,255,0.05); border: 1px solid var(--neon-blue); color: #fff; margin-bottom: 10px; }
        #preview-img { width: 100%; border-radius: 15px; display: none; margin-bottom: 15px; border: 2px solid var(--neon-blue); }
    </style>
</head>
<body>
    <div class="container py-4">
        <h2 class="hero-title">MENTOR SELFIE</h2>
        
        <div id="setup-form">
            <input type="text" id="stuName" class="form-control" placeholder="STUDENT NAME">
            <select id="stuDept" class="form-select mb-2 bg-dark text-white border-info">
                <option value="" disabled selected>DEPARTMENT</option>
                <option value="CT">CT</option><option value="EC">EC</option><option value="IE">IE</option>
            </select>
            <input type="text" id="stuSem" class="form-control" placeholder="SEMESTER (e.g. S6)">
            <button onclick="startCam()" class="btn btn-info w-100 fw-bold">OPEN CAMERA</button>
        </div>

        <div id="cam-ui" style="display:none;">
            <div id="camera-container">
                <video id="video" autoplay playsinline></video>
                <img id="preview-img">
            </div>
            <div class="text-center">
                <button id="captureBtn" onclick="takePhoto()" class="btn btn-capture w-75">📸 SNAP SELFIE</button>
                <button id="uploadBtn" onclick="uploadPhoto()" class="btn btn-success w-75 mt-2" style="display:none;">📤 UPLINK TO HUD</button>
                <button onclick="location.reload()" class="btn btn-link text-white-50 mt-2">Retake</button>
            </div>
        </div>
    </div>

    <script>
        const SCRIPT_URL = "YOUR_APPS_SCRIPT_URL"; // Paste your script URL here
        let stream;

        async function startCam() {
            if(!document.getElementById('stuName').value) return alert("Enter Name");
            document.getElementById('setup-form').style.display = 'none';
            document.getElementById('cam-ui').style.display = 'block';
            stream = await navigator.mediaDevices.getUserMedia({ 
                video: { facingMode: "user", width: { ideal: 1280 }, height: { ideal: 1706 } } 
            });
            document.getElementById('video').srcObject = stream;
        }

        function takePhoto() {
            const video = document.getElementById('video');
            const canvas = document.createElement('canvas');
            // Fixed 3:4 Aspect Ratio
            canvas.width = 720;
            canvas.height = 960;
            const ctx = canvas.getContext('2d');
            ctx.translate(canvas.width, 0); ctx.scale(-1, 1); // Maintain mirror look
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            document.getElementById('video').style.display = 'none';
            const preview = document.getElementById('preview-img');
            preview.src = canvas.toDataURL('image/jpeg', 0.8);
            preview.style.display = 'block';
            document.getElementById('captureBtn').style.display = 'none';
            document.getElementById('uploadBtn').style.display = 'inline-block';
        }

        async function uploadPhoto() {
            const btn = document.getElementById('uploadBtn');
            btn.disabled = true; btn.innerText = "UPLOADING...";
            
            const blob = document.getElementById('preview-img').src.split(',')[1];
            const meta = {
                name: document.getElementById('stuName').value,
                dept: document.getElementById('stuDept').value,
                sem: document.getElementById('stuSem').value
            };

            fetch(SCRIPT_URL, {
                method: "POST",
                body: JSON.stringify({ action: "mentorSelfie", img: blob, ...meta })
            })
            .then(res => res.text())
            .then(data => {
                alert("Selfie Uplinked! Check the main screen.");
                location.reload();
            });
        }
    </script>
</body>
</html>
