<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asset Control | SYNAPSE 2026</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root { --neon-blue: #1fc1d1; --neon-pink: #ff0055; --dark-bg: #0a0a0f; }
        body { 
            background: var(--dark-bg); 
            color: #fff; 
            font-family: 'Rajdhani', sans-serif; 
            min-height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            padding: 20px; 
            background-image: radial-gradient(circle at 50% 50%, #161625 0%, #0a0a0f 100%);
        }
        .manager-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(31, 193, 209, 0.3);
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 550px;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.5), 0 0 20px rgba(31, 193, 209, 0.1);
        }
        h3 { 
            font-family: 'Orbitron'; 
            color: var(--neon-blue); 
            text-transform: uppercase; 
            letter-spacing: 3px; 
            text-align: center; 
            margin-bottom: 30px;
            text-shadow: 0 0 10px rgba(31, 193, 209, 0.5);
        }
        .label-cyber { 
            color: var(--neon-blue); 
            font-size: 0.75rem; 
            font-family: 'Orbitron'; 
            margin-bottom: 8px; 
            display: block; 
            text-transform: uppercase; 
            font-weight: 700;
        }
        .form-control, .form-select {
            background: rgba(0,0,0,0.6) !important;
            border: 1px solid #444;
            color: #fff !important;
            margin-bottom: 25px;
            padding: 12px;
            transition: all 0.3s;
        }
        .form-control:focus, .form-select:focus {
            border-color: var(--neon-blue);
            box-shadow: 0 0 10px rgba(31, 193, 209, 0.3);
        }
        .progress { height: 8px; background-color: #111; border-radius: 10px; margin-bottom: 20px; display: none; overflow: hidden; }
        .progress-bar { 
            background: linear-gradient(90deg, var(--neon-blue), var(--neon-pink));
            box-shadow: 0 0 10px var(--neon-blue);
            width: 0%; 
            transition: width 0.4s ease; 
        }
        .btn-cyber {
            background: transparent;
            border: 2px solid var(--neon-pink);
            color: var(--neon-pink);
            font-family: 'Orbitron';
            font-weight: 700;
            width: 100%;
            padding: 14px;
            transition: 0.3s;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-top: 10px;
        }
        .btn-cyber:hover:not(:disabled) { 
            background: var(--neon-pink); 
            color: #fff; 
            box-shadow: 0 0 25px var(--neon-pink); 
            transform: translateY(-2px);
        }
        .btn-cyber:disabled { opacity: 0.5; cursor: not-allowed; border-color: #555; color: #555; }
        #statusMsg { 
            font-size: 0.85rem; 
            text-align: center; 
            margin-top: 20px; 
            font-weight: bold; 
            font-family: 'Orbitron'; 
            letter-spacing: 1px;
            min-height: 20px;
        }
        .footer-link {
            text-align: center;
            margin-top: 25px;
            display: block;
            color: #666;
            text-decoration: none;
            font-size: 0.7rem;
            font-family: 'Orbitron';
            transition: 0.3s;
        }
        .footer-link:hover { color: var(--neon-blue); }
    </style>
</head>
<body>

<div class="manager-card">
    <h3>Asset Control</h3>
    
    <span class="label-cyber">1. Select Destination Stream</span>
    <select id="assetType" class="form-select shadow-none">
        <optgroup label="Visual Moments">
            <option value="LIVE_MOMENT">Live Event Moment (Slideshow)</option>
            <option value="ACHIEVEMENT">Student Achievement (Spotlight)</option>
        </optgroup>
        <optgroup label="Sponsorship & Ads">
            <option value="SPONSOR_LOGO">Sponsor Logo (Footer Scroller)</option>
            <option value="SPONSOR_VIDEO">Sponsor Commercial (Video)</option>
        </optgroup>
        <optgroup label="Social Content">
            <option value="STUDENT_REEL">Student Reel / Short Video</option>
        </optgroup>
    </select>

    <span class="label-cyber">2. Asset Description / Tag</span>
    <input type="text" id="assetTag" class="form-control shadow-none" placeholder="e.g. Morning Prayer, Nike, Top Scorer...">

    <span class="label-cyber">3. Upload File (Image or MP4)</span>
    <input type="file" id="fileInput" class="form-control shadow-none" accept="image/*,video/mp4">
    
    <div class="progress" id="progressContainer">
        <div class="progress-bar" id="progressBar"></div>
    </div>

    <button onclick="handleFileUpload()" class="btn-cyber" id="submitBtn">Deploy to HUD</button>
    
    <div id="statusMsg">HUD LINK STABLE</div>

    <a href="live.html" class="footer-link">[ VIEW LIVE STREAM ]</a>
</div>

<script>
    // Replace with your specific Apps Script Web App URL
    const scriptURL = 'https://script.google.com/macros/s/AKfycbzb97bG3GTT1wMH7M9j8RDXkoqoFD_MWXFkUZS0przdUO51s-7Zyutn0FbRSRnjjH8X5A/exec';

    function handleFileUpload() {
        const fileInput = document.getElementById('fileInput');
        const type = document.getElementById('assetType').value;
        const tag = document.getElementById('assetTag').value || "General Moment";
        const btn = document.getElementById('submitBtn');
        const status = document.getElementById('statusMsg');
        const progBar = document.getElementById('progressBar');
        const progCont = document.getElementById('progressContainer');

        if (fileInput.files.length === 0) return alert("System Error: No file selected!");

        const file = fileInput.files[0];
        
        // Size validation (Max 10MB to avoid Apps Script timeouts)
        if (file.size > 10 * 1024 * 1024) return alert("System Error: File too large (Max 10MB)");

        const reader = new FileReader();

        btn.disabled = true;
        progCont.style.display = 'flex';
        progBar.style.width = '15%';
        status.innerText = "UPLOADING ASSET...";
        status.style.color = "var(--neon-blue)";

        reader.onload = function(e) {
            const rawData = e.target.result.split(',')[1];
            progBar.style.width = '50%';
            status.innerText = "ENCRYPTING DATA...";

            fetch(scriptURL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    action: "uploadAsset",
                    type: type,
                    fileName: file.name,
                    fileData: rawData,
                    tag: tag
                })
            })
            .then(() => {
                // Success Assumption due to 'no-cors'
                progBar.style.width = '100%';
                status.innerText = "BROADCAST SUCCESSFUL";
                status.style.color = "#2ed573";
                
                // Clear inputs
                fileInput.value = "";
                document.getElementById('assetTag').value = "";
                
                setTimeout(() => {
                    btn.disabled = false;
                    progCont.style.display = 'none';
                    progBar.style.width = '0%';
                    status.innerText = "HUD LINK STABLE";
                    status.style.color = "#fff";
                }, 3000);
            })
            .catch(err => {
                console.error("Uplink Error:", err);
                status.innerText = "UPLINK FAILED: CHECK CONNECTION";
                status.style.color = "var(--neon-pink)";
                btn.disabled = false;
            });
        };

        reader.onerror = () => {
            alert("Local Error: Could not read file.");
            btn.disabled = false;
        };

        reader.readAsDataURL(file);
    }
</script>
</body>
</html>
