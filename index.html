<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SYNAPSE 2026 | Launching Soon</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>

    <style>
        :root {
            --poster-pink: #d11fb7;
            --poster-blue: #1fc1d1;
            --poster-purple: #741fd1;
            --background-dark: #07060f;
        }

        body, html {
            height: 100%;
            margin: 0;
            background-color: var(--background-dark);
            color: white;
            font-family: 'Segoe UI', sans-serif;
            overflow: hidden;
        }

        #particles-js {
            position: absolute;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .hero-section {
            position: relative;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
            text-align: center;
            background: radial-gradient(circle at center, rgba(116, 31, 209, 0.15) 0%, transparent 70%);
        }

        .glitch-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 5rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 10px;
            color: var(--poster-blue);
            text-shadow: 0 0 20px var(--poster-blue);
            margin-bottom: 10px;
        }

        .subtitle {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.5rem;
            color: var(--poster-pink);
            letter-spacing: 5px;
            text-transform: uppercase;
        }

        .countdown-box {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(31, 193, 209, 0.3);
            border-radius: 15px;
            padding: 20px;
            backdrop-filter: blur(10px);
            display: inline-flex;
            gap: 20px;
            margin-top: 30px;
        }

        .count-item {
            min-width: 80px;
        }

        .count-number {
            display: block;
            font-size: 2.5rem;
            font-weight: 900;
            font-family: 'Orbitron', sans-serif;
        }

        .count-label {
            font-size: 0.7rem;
            text-transform: uppercase;
            color: var(--poster-pink);
        }

        .launch-btn {
            background: linear-gradient(135deg, var(--poster-blue), var(--poster-purple));
            border: none;
            padding: 15px 40px;
            color: white;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            border-radius: 50px;
            margin-top: 40px;
            transition: 0.3s;
            text-decoration: none;
            display: inline-block;
        }

        .launch-btn:hover {
            box-shadow: 0 0 30px var(--poster-purple);
            transform: scale(1.05);
            color: white;
        }

        @media (max-width: 768px) {
            .glitch-title { font-size: 2.5rem; letter-spacing: 5px; }
            .subtitle { font-size: 1rem; }
            .countdown-box { gap: 10px; padding: 10px; }
            .count-item { min-width: 60px; }
            .count-number { font-size: 1.5rem; }
        }
    </style>
</head>
<body>

    <div id="particles-js"></div>

    <div class="hero-section container">
        <div class="animate__animated animate__fadeIn">
            <p class="subtitle">Connecting Ideas. Creating Innovation.</p>
            <h1 class="glitch-title">SYNAPSE 2026</h1>
            <p class="lead">The ultimate Tech Fest is almost here. Get ready to innovate.</p>

            <div class="countdown-box animate__animated animate__zoomIn">
                <div class="count-item">
                    <span class="count-number" id="days">00</span>
                    <span class="count-label">Days</span>
                </div>
                <div class="count-item">
                    <span class="count-number" id="hours">00</span>
                    <span class="count-label">Hours</span>
                </div>
                <div class="count-item">
                    <span class="count-number" id="minutes">00</span>
                    <span class="count-label">Mins</span>
                </div>
                <div class="count-item">
                    <span class="count-number" id="seconds">00</span>
                    <span class="count-label">Secs</span>
                </div>
            </div>

            <br>
            <a href="https://synapse2026.github.io/registration.html" class="launch-btn">PRE-REGISTER NOW</a>
            
            <p class="mt-5 text-secondary" style="font-size: 0.8rem;">POWERED BY TEAM CT, GRWPC</p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>
    <script>
        // Particles Background
        particlesJS("particles-js", {
            "particles": {
                "number": { "value": 80 },
                "color": { "value": ["#d11fb7", "#1fc1d1"] },
                "shape": { "type": "circle" },
                "opacity": { "value": 0.5 },
                "size": { "value": 3 },
                "line_linked": { "enable": true, "distance": 150, "color": "#741fd1", "opacity": 0.4, "width": 1 },
                "move": { "enable": true, "speed": 3 }
            }
        });

        // Set Launch Date (March 17, 2026)
        const launchDate = new Date("March 17, 2026 09:00:00").getTime();

        const timer = setInterval(function() {
            const now = new Date().getTime();
            const distance = launchDate - now;

            const d = Math.floor(distance / (1000 * 60 * 60 * 24));
            const h = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const m = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const s = Math.floor((distance % (1000 * 60)) / 1000);

            document.getElementById("days").innerHTML = d.toString().padStart(2, '0');
            document.getElementById("hours").innerHTML = h.toString().padStart(2, '0');
            document.getElementById("minutes").innerHTML = m.toString().padStart(2, '0');
            document.getElementById("seconds").innerHTML = s.toString().padStart(2, '0');

            if (distance < 0) {
                clearInterval(timer);
                document.querySelector(".countdown-box").innerHTML = "<h3>LIT UP!</h3>";
            }
        }, 1000);
    </script>
</body>
</html>
