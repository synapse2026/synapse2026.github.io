<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SYNAPSE 2026 | Registration</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <style>
        :root {
            --poster-pink: #d11fb7;
            --poster-blue: #1fc1d1;
            --poster-purple: #741fd1;
            --background-dark: #07060f;
        }

        body { 
            background-color: var(--background-dark);
            color: #fff;
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        #particles-js {
            position: fixed;
            width: 100%; height: 100%;
            top: 0; left: 0; z-index: 1; /* Low z-index */
        }

        .main-content { position: relative; z-index: 10; padding: 20px; }

        .poster-container {
            max-width: 800px;
            margin: 10px auto 30px auto;
            border-radius: 12px;
            box-shadow: 0 0 30px rgba(116, 31, 209, 0.4);
            border: 2px solid var(--poster-purple);
        }

        .poster-image { width: 100%; height: auto; display: block; border-radius: 10px; }

        .card { 
            background: rgba(15, 12, 41, 0.96);
            border: 1.5px solid #444;
            border-radius: 20px; 
            box-shadow: 0 20px 60px rgba(0,0,0,0.9);
        }

        .form-label { 
            font-weight: 800 !important; 
            color: #ffffff !important; 
            text-transform: uppercase;
        }

        /* FIX: High visibility for typed text */
        .form-control, .form-select {
            background-color: #ffffff !important;
            border: 2px solid #666;
            color: #000000 !important;
            font-weight: 600;
        }

        .event-grid { 
            background: rgba(209, 31, 183, 0.1);
            padding: 20px;
            border-radius: 15px;
            border: 2px solid var(--poster-pink);
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--poster-pink), var(--poster-purple));
            border: none;
            padding: 18px;
            font-weight: 900;
            letter-spacing: 2px;
        }

        /* FIX: Success Page Layering */
        #successMsg {
            position: relative;
            z-index: 9999 !important; /* Force to absolute top */
            border: 3px solid var(--poster-blue);
            background: #000;
            border-radius: 20px;
            padding: 40px 20px;
            pointer-events: auto !important;
        }

        .btn-receipt {
            background: var(--poster-blue);
            color: #000;
            font-weight: 900;
            border: none;
            padding: 20px;
            width: 100%;
            margin-top: 20px;
            border-radius: 12px;
            cursor: pointer;
            display: block;
            position: relative;
            z-index: 10000; /* Ensure button itself is top */
            touch-action: manipulation;
        }

        #qrcode-hidden { display: none; }
    </style>
</head>
<body>

    <div id="particles-js"></div>
    <div id="qrcode-hidden"></div> 

    <div class="main-content container my-4">
        
        <div class="poster-container animate__animated animate__fadeIn">
            <img src="synapse-poster.jpg" alt="Synapse 2026 Poster" class="poster-image">
        </div>

        <div class="row justify-content-center">
            <div class="col-lg-8">
                
                <div id="formCard" class="card animate__animated animate__fadeInUp">
                    <div class="card-body p-4 p-md-5">
                        <h2 class="text-center text-uppercase mb-5" style="color: var(--poster-blue); font-weight: 900;">
                            Registration Form
                        </h2>
                        
                        <form id="regForm">
                            <div class="row g-4">
                                <div class="col-md-6"><label class="form-label">Name</label><input type="text" id="name" class="form-control" required></div>
                                <div class="col-md-6"><label class="form-label">Mobile</label><input type="tel" id="mobile" class="form-control" pattern="[0-9]{10}" required></div>
                                <div class="col-md-6"><label class="form-label">Email</label><input type="email" id="email" class="form-control" required></div>
                                <div class="col-md-6"><label class="form-label">College</label><input type="text" id="college" class="form-control" required></div>
                                <div class="col-md-6">
                                    <label class="form-label">Department</label>
                                    <select id="department" class="form-select" required>
                                        <option value="" selected disabled>Select</option>
                                        <option>Computer Science</option><option>Electronics</option><option>Mechanical</option><option>Civil</option>
                                    </select>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Semester</label>
                                    <select id="semester" class="form-select" required>
                                        <option>S1</option><option>S2</option><option>S3</option><option>S4</option><option>S5</option><option>S6</option>
                                    </select>
                                </div>
                            </div>

                            <div class="mt-5">
                                <label class="form-label d-block mb-3 text-center">Events Selection</label>
                                <div class="event-grid row row-cols-2 g-3">
                                    <div class="col text-center"><input class="event-check" type="checkbox" value="Hackathons" id="e1"> <label for="e1">Hackathons</label></div>
                                    <div class="col text-center"><input class="event-check" type="checkbox" value="Workshops" id="e2"> <label for="e2">Workshops</label></div>
                                    <div class="col text-center"><input class="event-check" type="checkbox" value="Gaming" id="e6"> <label for="e6">Gaming</label></div>
                                    <div class="col text-center"><input class="event-check" type="checkbox" value="Quizzes" id="e5"> <label for="e5">Quizzes</label></div>
                                </div>
                                <button type="submit" id="submitBtn" class="btn btn-primary w-100 mt-5 shadow">SUBMIT REGISTRATION</button>
                            </div>
                        </form>
                    </div>
                </div>

                <div id="successMsg" class="animate__animated animate__bounceIn d-none text-center">
                    <h1 style="color: var(--poster-blue); font-weight: 900;">SUCCESS!</h1>
                    <p class="lead text-white">Your registration for SYNAPSE 2026 is confirmed.</p>
                    <hr style="border-color: #444;">
                    <div id="receiptDetails" class="text-start mb-4 px-3" style="font-size: 0.9rem; color: #bbb;"></div>
                    <button id="downloadBtn" class="btn-receipt">📥 DOWNLOAD QR RECEIPT (PDF)</button>
                </div>

            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>
    <script>
        particlesJS("particles-js", { "particles": { "number": { "value": 40 }, "color": { "value": "#ffffff" }, "line_linked": { "enable": true, "color": "#1fc1d1" }, "move": { "enable": true, "speed": 1 } } });

        const scriptURL = 'https://script.google.com/macros/s/AKfycbwKjrjjrV5hJUrqaP5nWjYAW2HW50y6EI3_k9bfzriS8ktMuAHpYe1i8K6IyPFV-jsndA/exec';
        let registrationData = {};

        document.getElementById('regForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const mobile = document.getElementById('mobile').value;
            const events = Array.from(document.querySelectorAll('.event-check:checked')).map(cb => cb.value);
            
            if(events.length === 0) return alert("Select an event!");

            btn.disabled = true;
            btn.innerHTML = 'CHECKING DATABASE...';

            // 1. Duplicate Check
            fetch(`${scriptURL}?action=search&mobile=${mobile}`)
            .then(res => res.json())
            .then(data => {
                if(data !== "NotFound") {
                    alert("Error: This mobile number is already registered!");
                    btn.disabled = false; btn.innerHTML = 'SUBMIT REGISTRATION';
                } else {
                    sendData(events);
                }
            }).catch(() => sendData(events));
        });

        function sendData(events) {
            const btn = document.getElementById('submitBtn');
            btn.innerHTML = 'REGISTERING...';
            registrationData = {
                name: document.getElementById('name').value,
                mobile: document.getElementById('mobile').value,
                college: document.getElementById('college').value,
                events: events.join(", ")
            };
            fetch(scriptURL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(registrationData) })
            .then(() => handleSuccess());
        }

        function handleSuccess() {
            document.getElementById('formCard').classList.add('d-none');
            document.querySelector('.poster-container').classList.add('d-none');
            document.getElementById('successMsg').classList.remove('d-none');
            document.getElementById('receiptDetails').innerHTML = `<b>Name:</b> ${registrationData.name}<br><b>Mobile:</b> ${registrationData.mobile}`;
            window.scrollTo(0,0);
        }

        // FIX: Direct Mobile Event Listener
        document.getElementById('downloadBtn').addEventListener('click', function() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            const qrDiv = document.getElementById("qrcode-hidden");
            qrDiv.innerHTML = ""; 

            new QRCode(qrDiv, {
                text: registrationData.mobile,
                width: 256, height: 256,
                colorDark: "#000000", colorLight: "#ffffff",
                correctLevel: QRCode.CorrectLevel.H
            });

            setTimeout(() => {
                const imgData = qrDiv.querySelector("img").src;
                doc.setFillColor(7, 6, 15); doc.rect(0, 0, 210, 297, 'F');
                doc.setTextColor(31, 193, 209); doc.setFontSize(26); doc.text("SYNAPSE 2026", 105, 40, { align: "center" });
                doc.setFillColor(255, 255, 255); doc.rect(60, 55, 90, 90, 'F');
                doc.addImage(imgData, 'PNG', 65, 60, 80, 80);
                doc.setTextColor(255, 255, 255); doc.setFontSize(14);
                doc.text(`Name: ${registrationData.name}`, 30, 160);
                doc.text(`Mobile: ${registrationData.mobile}`, 30, 175);
                doc.save(`Synapse2026_${registrationData.name}.pdf`);
            }, 600);
        });
    </script>
</body>
</html>
