<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SYNAPSE 2026 | Staff Scanner</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://unpkg.com/html5-qrcode"></script>

    <style>
        body { background: #07060f; color: #fff; font-family: sans-serif; }
        .scanner-container { max-width: 500px; margin: auto; padding: 20px; }
        #reader { border-radius: 20px; overflow: hidden; border: 2px solid #1fc1d1 !important; }
        .result-card { 
            background: rgba(255, 255, 255, 0.1); 
            border-radius: 15px; 
            padding: 20px; 
            margin-top: 20px; 
            display: none; 
            border-left: 5px solid #d11fb7;
        }
        .btn-scan { background: #1fc1d1; color: #000; font-weight: bold; width: 100%; padding: 15px; border-radius: 10px; border: none; }
    </style>
</head>
<body>

    <div class="scanner-container text-center">
        <h2 class="my-4" style="color: #1fc1d1;">SYNAPSE SCANNER</h2>
        <p class="text-white-50">Scan student QR receipts for entry</p>

        <div id="reader"></div>

        <div id="result" class="result-card text-start">
            <h4 style="color: #d11fb7;">STUDENT VERIFIED</h4>
            <hr>
            <div id="scannedData"></div>
            <button class="btn btn-outline-info btn-sm mt-3" onclick="resetScanner()">Scan Next</button>
        </div>

        <div class="mt-4">
            <small class="text-muted">Govt. Residential Women's Polytechnic College</small>
        </div>
    </div>

    <script>
        const html5QrCode = new Html5Qrcode("reader");
        const config = { fps: 10, qrbox: { width: 250, height: 250 } };

        const onScanSuccess = (decodedText, decodedResult) => {
            // Stop scanning once found
            html5QrCode.stop().then(() => {
                document.getElementById('result').style.display = 'block';
                
                // Format the data for display
                // We split by "|" because that's how we saved it in the receipt
                const details = decodedText.split('|').join('<br>');
                document.getElementById('scannedData').innerHTML = details;

                // Optional: Play a success sound
                const audio = new Audio('https://www.soundjay.com/buttons/button-3.mp3');
                audio.play();
            });
        };

        // Start Scanner
        html5QrCode.start({ facingMode: "environment" }, config, onScanSuccess);

        function resetScanner() {
            document.getElementById('result').style.display = 'none';
            html5QrCode.start({ facingMode: "environment" }, config, onScanSuccess);
        }
    </script>
</body>
</html>
