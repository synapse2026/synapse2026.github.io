<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SYNAPSE 2026 | Launching Soon</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>

    <style>
        :root {
            --poster-pink: #d11fb7;
            --poster-blue: #1fc1d1;
            --poster-purple: #741fd1;
            --background-dark: #07060f;
        }

        body, html {
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: var(--background-dark);
            color: white;
            font-family: 'Segoe UI', sans-serif;
            overflow-x: hidden; /* Prevents horizontal scrolling */
        }

        #particles-js {
            position: absolute;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .hero-section {
            position: relative;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
            text-align: center;
            padding: 40px 15px; /* Side padding for mobile */
            background: radial-gradient(circle at center, rgba(116, 31, 209, 0.15) 0%, transparent 70%);
        }

        .glitch-title, #launch-notice {
            visibility: hidden; 
        }

        /* Fluid Typography: min, preferred, max */
        .glitch-title {
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(2.2rem, 8vw, 5rem);
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: clamp(3px, 1.5vw, 10px);
            color: var(--poster-blue);
            text-shadow: 0 0 20px var(--poster-blue);
            margin-bottom: 10px;
            line-height: 1.2;
        }

        #launch-notice {
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(0.75rem, 3vw, 1.1rem);
            color: #fff;
            letter-spacing: 2px;
            margin-bottom: 30px; 
            text-shadow: 0 0 10px var(--poster-purple);
        }

        .pulsate {
            animation: pulse-animation 2s infinite ease-in-out;
        }

        @keyframes pulse-animation {
            0% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.05); opacity: 1; }
            100% { transform: scale(1); opacity: 0.8; }
        }

        .subtitle {
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(0.9rem, 4vw, 1.5rem);
            color: var(--poster-pink);
            letter-spacing: clamp(1px, 1vw, 5px);
            text-transform: uppercase;
            min-height: 1.6em;
            margin-bottom: 10px;
        }

        .cursor {
            display: inline-block;
            width: 8px;
            background-color: var(--poster-pink);
            margin-left: 5px;
            animation: blink 0.7s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 0; }
            50% { opacity: 1; }
        }

        /* Responsive Countdown */
        .countdown-box {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(31, 193, 209, 0.3);
            border-radius: 15px;
            padding: clamp(10px, 4vw, 20px);
            backdrop-filter: blur(10px);
            display: inline-flex;
            gap: clamp(8px, 2.5vw, 20px);
            margin-top: 10px;
            max-width: 100%;
        }

        .count-item { min-width: clamp(55px, 18vw, 85px); }
        .count-number {
            display: block;
            font-size: clamp(1.4rem, 6vw, 2.5rem);
            font-weight: 900;
            font-family: 'Orbitron', sans-serif;
        }
        .count-label {
            font-size: clamp(0.55rem, 2vw, 0.7rem);
            text-transform: uppercase;
            color: var(--poster-pink);
        }

        .launch-btn {
            background: linear-gradient(135deg, var(--poster-blue), var(--poster-purple));
            border: none;
            padding: 12px clamp(25px, 6vw, 40px);
            color: white;
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            font-size: clamp(0.85rem, 3vw, 1rem);
            border-radius: 50px;
            margin-top: 40px;
            transition: 0.3s;
            text-decoration: none;
            display: inline-block;
        }

        .launch-btn:hover {
            box-shadow: 0 0 30px var(--poster-purple);
            transform: scale(1.05);
            color: white;
        }

        /* --- SPONSOR SECTION --- */
        .sponsor-section {
            margin-top: 60px;
            width: 100%;
        }

        .sponsor-label {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.75rem;
            letter-spacing: 5px;
            color: var(--poster-pink);
            text-transform: uppercase;
            margin-bottom: 25px;
            font-weight: bold;
        }

        .official-sponsor-container {
            position: relative;
            display: inline-block;
            padding: 3px;
            background: linear-gradient(45deg, var(--poster-blue), transparent, var(--poster-purple));
            border-radius: 20px;
            margin-bottom: 40px;
            overflow: hidden;
            max-width: 95%; /* Prevents overflow in mobile */
        }

        .official-sponsor-inner {
            background: rgba(7, 6, 15, 0.9);
            backdrop-filter: blur(10px);
            padding: clamp(15px, 5vw, 30px);
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .official-logo {
            max-width: 100%;
            height: auto;
            width: clamp(200px, 70vw, 280px); /* Resizes perfectly */
            mix-blend-mode: screen; 
            filter: brightness(1.1);
        }

        /* Scanline Animation */
        .official-sponsor-inner::after {
            content: "";
            position: absolute;
            top: -100%; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to bottom, transparent, rgba(31, 193, 209, 0.1), transparent);
            animation: scanline 4s infinite linear;
        }

        @keyframes scanline {
            0% { top: -100%; }
            100% { top: 100%; }
        }

        .marquee-container {
            width: 100%;
            overflow: hidden;
            white-space: nowrap;
            position: relative;
            padding: 20px 0;
            background: rgba(255, 255, 255, 0.02);
        }

        .marquee-content {
            display: inline-flex;
            animation: scroll 30s linear infinite;
        }

        .co-sponsor-text {
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(0.9rem, 4vw, 1.4rem);
            font-weight: 700;
            color: rgba(255, 255, 255, 0.2);
            margin: 0 40px;
            letter-spacing: 4px;
            text-transform: uppercase;
        }

        @keyframes scroll {
            from { transform: translateX(0); }
            to { transform: translateX(-50%); }
        }

        /* Footer Text */
        .footer-credit {
            margin-top: 50px;
            font-size: 0.7rem;
            color: #6c757d;
            letter-spacing: 1px;
        }

        /* Mobile specific spacing */
        @media (max-width: 480px) {
            .hero-section { padding-top: 20px; }
            .official-sponsor-inner { padding: 15px; }
            .co-sponsor-text { margin: 0 25px; }
        }
    </style>
</head>
<body>

    <div id="particles-js"></div>

    <div class="hero-section container">
        <div class="animate__animated animate__fadeIn w-100">
            <p class="subtitle"><span id="typing-text"></span><span class="cursor">&nbsp;</span></p>
            
            <h1 id="main-heading" class="glitch-title">SYNAPSE 2026</h1>
            
            <div id="launch-notice">Official site will be launched soon</div>
            
            <div class="countdown-box animate__animated animate__zoomIn">
                <div class="count-item"><span class="count-number" id="days">00</span><span class="count-label">Days</span></div>
                <div class="count-item"><span class="count-number" id="hours">00</span><span class="count-label">Hours</span></div>
                <div class="count-item"><span class="count-number" id="minutes">00</span><span class="count-label">Mins</span></div>
                <div class="count-item"><span class="count-number" id="seconds">00</span><span class="count-label">Secs</span></div>
            </div>

            <br>
            <a href="https://synapse2026.github.io/registration.html" class="launch-btn">PRE-REGISTER NOW</a>

            <div class="sponsor-section">
                <p class="sponsor-label">Official Sponsor</p>
                <div class="official-sponsor-container animate__animated animate__fadeInUp">
                    <div class="official-sponsor-inner">
                        <img src="sponser.png" alt="Sponsor" class="official-logo">
                    </div>
                </div>

                <p class="sponsor-label">Co-Sponsors</p>
                <div class="marquee-container">
                    <div class="marquee-content">
                        <span class="co-sponsor-text">Coming Soon</span>
                        <span class="co-sponsor-text">Announcing Soon</span>
                        <span class="co-sponsor-text">Partner with Us</span>
                        <span class="co-sponsor-text">Future Innovators</span>
                        <span class="co-sponsor-text">Coming Soon</span>
                        <span class="co-sponsor-text">Announcing Soon</span>
                        <span class="co-sponsor-text">Partner with Us</span>
                        <span class="co-sponsor-text">Future Innovators</span>
                    </div>
                </div>
            </div>

            <p class="footer-credit">WEBSITE POWERED BY TEAM CT, GRWPC</p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>
    <script>
        particlesJS("particles-js", {
            "particles": {
                "number": { "value": 50 },
                "color": { "value": ["#d11fb7", "#1fc1d1"] },
                "shape": { "type": "circle" },
                "opacity": { "value": 0.4 },
                "size": { "value": 2.5 },
                "line_linked": { "enable": true, "distance": 120, "color": "#741fd1", "opacity": 0.3, "width": 1 },
                "move": { "enable": true, "speed": 2 }
            }
        });

        // Typing Effect and Scroll Logic
        const fullText = "Connecting Ideas. Creating Innovation.";
        const triggerPhrase = "Connecting Ideas."; 
        const typingElement = document.getElementById("typing-text");
        const headingElement = document.getElementById("main-heading");
        const launchNotice = document.getElementById("launch-notice");
        
        let isDeleting = false;
        let charIndex = 0;
        let hasHeadingLoaded = false;

        function typeLoop() {
            const currentDisplay = isDeleting 
                ? fullText.substring(0, charIndex - 1) 
                : fullText.substring(0, charIndex + 1);

            typingElement.innerHTML = currentDisplay;
            charIndex = isDeleting ? charIndex - 1 : charIndex + 1;

            if (!isDeleting && currentDisplay.includes(triggerPhrase) && !hasHeadingLoaded) {
                headingElement.style.visibility = "visible";
                headingElement.classList.add("animate__animated", "animate__backInDown");
                
                setTimeout(() => {
                    launchNotice.style.visibility = "visible";
                    launchNotice.classList.add("animate__animated", "animate__fadeInUp", "pulsate");
                }, 400);

                hasHeadingLoaded = true;
            }

            let typeSpeed = isDeleting ? 40 : 80;
            if (!isDeleting && charIndex === fullText.length) { isDeleting = true; typeSpeed = 2000; } 
            else if (isDeleting && charIndex === 0) { isDeleting = false; typeSpeed = 500; }
            setTimeout(typeLoop, typeSpeed);
        }

        window.onload = () => setTimeout(typeLoop, 800);

        // Countdown Timer Logic
        const launchDate = new Date("March 17, 2026 09:00:00").getTime();
        const timer = setInterval(function() {
            const now = new Date().getTime();
            const distance = launchDate - now;
            const d = Math.floor(distance / (1000 * 60 * 60 * 24));
            const h = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const m = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const s = Math.floor((distance % (1000 * 60)) / 1000);
            
            document.getElementById("days").innerHTML = d.toString().padStart(2, '0');
            document.getElementById("hours").innerHTML = h.toString().padStart(2, '0');
            document.getElementById("minutes").innerHTML = m.toString().padStart(2, '0');
            document.getElementById("seconds").innerHTML = s.toString().padStart(2, '0');
        }, 1000);
    </script>
</body>
</html>
